/* =====================================================================
   תאוריה מדברת · מסך תרגול ובחינה
   הבדל יחיד: בתרגול יש רמזים מדורגים וניסיונות חוזרים. בבחינה — ניסיון אחד.
   ===================================================================== */
function renderPractice(){
  S.mode = 'practice'; S.hint = 0; S.answered = false;
  /* חפיסה ריקה מפילה את P() — עדיף לחזור הביתה מאשר מסך שבור */
  if(!S.deck.length){ go('home'); return; }
  const p = P(), d = PT(), isExam = S.screen === 'exam';
  el('pill').textContent = `${t('question')} ${S.qi+1} ${t('of')} ${S.deck.length}`;
  screen.innerHTML = `
<div class="stage" id="stage">${p.img ? '<img class="qimg" src="' + escapeHTML(safeImgSrc(p.img)) + '" alt="" loading="lazy" decoding="async" onerror="this.remove()">' : signSVG(p.sign,'sign')}</div>
   
    <div class="road" role="progressbar" aria-label="${t('progress')}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round((S.qi)/S.deck.length*100)}">
      <div class="road-fill" style="width:${(S.qi/S.deck.length*100)}%"></div>
    </div>
    <h2 class="qtitle" aria-live="polite">${escapeHTML(d.q)}</h2>
    <div id="hints" aria-live="polite"></div>
    ${d.o.map((o,i)=>`<button class="opt" type="button" data-ans="${i}"><b class="optnum" aria-hidden="true">${i+1}</b><span aria-live="polite">${escapeHTML(o)}</span></button>`).join('')}
    ${isExam ? '' :

         ואין שום דרך להתקדם חוץ מלפגוע נכון — מי שנתקע נתקע. */
      `<button class="hintbtn" id="btnSkip" type="button">${t('skipQ')}</button>`}
    <div id="after"></div>`;
  speakQuestion(d.q, d.o);
}

/* --- רמזים מדורגים --- */
function showHint(level, speakIt){
  const p = P(), d = PT();
  S.hint = Math.max(S.hint, level);

  if(S.hint >= 1){
    const stage = el('stage');
    if(stage && !stage.querySelector('.spot')) stage.insertAdjacentHTML('beforeend', spotSVG(p.focus));
  }
  const box = el('hints');
  box.innerHTML =
    (S.hint >= 1 ? `<div class="hintbox" tabindex="-1"><b>${t('hint1T')}</b>${escapeHTML(d.h1)}</div>` : '') +
    (S.hint >= 2 ? `<div class="hintbox" tabindex="-1"><b>${t('hint2T')}</b>${escapeHTML(d.h2)}</div>` : '');

  const hb = el('btnHint');
  if(hb){
    hb.textContent = t('hint2');
    hb.disabled = S.hint >= 2;
  }
  /* הפוקוס עובר לרמז החדש — אחרת הוא נופל ל-body כשכפתור מנוטרל */
  const boxes = box.querySelectorAll('.hintbox');
  if(boxes.length) boxes[boxes.length-1].focus();

  if(speakIt) speakQueue([S.hint >= 2 ? d.h2 : d.h1]);
}

function answerPractice(i){
  const p = P(), d = PT(), isExam = S.screen === 'exam';
  const btns = [...screen.querySelectorAll('.opt')];
  stopSpeech();

  /* ---- תשובה נכונה: חיזוק חיובי ---- */
  if(i === p.c){
    btns.forEach(b => b.disabled = true);
    btns[i].classList.add('right');
    if(!S.answered){ S.correct++; recordAnswer(p.cat, true, true); }
    S.answered = true;
    markDayActivity();
    const hb = el('btnHint'); if(hb) hb.disabled = true;
    const sb = el('btnSkip'); if(sb) sb.remove();

    const last = S.qi === S.deck.length - 1;
    el('after').innerHTML =
      `<div class="praise" role="status" tabindex="-1">${escapeHTML(d.p)}</div>
       <button class="bigbtn" id="btnNextQ" type="button">${last ? t('seeResult') : t('nextQ')}</button>`;
    el('after').firstElementChild.focus();
    /* focus אמור לגלול, אבל התנהגותו משתנה בין דפדפנים. כשהמשוב
       ארוך — למשל קופסת 'כמעט' — הכפתור נופל מתחת לקיפול, וזו
       הפעולה שחוזרת יותר מכל אחרת. מבקשים במפורש. */
    if(el('btnNextQ') && el('btnNextQ').scrollIntoView){
      try{ el('btnNextQ').scrollIntoView({ block:'nearest',
        behavior: matchMedia('(prefers-reduced-motion:reduce)').matches ? 'auto' : 'smooth' }); }
      catch(e){ el('btnNextQ').scrollIntoView(); }
    }
    el('btnNextQ').addEventListener('click', () => {
      if(last){ go('result'); return; }
      S.qi++; stopSpeech(); render();
    });
    speakQueue([d.p]);
    return;
  }

  /* ---- בבחינה: ניסיון אחד, בלי צבע כישלון ---- */
  if(isExam){
    /* בבחינה יש ניסיון אחד בלבד, ולכן אין צורך בשמירה מפני רישום כפול */
    recordAnswer(p.cat, false, false);
    recordMistake(p.id, p.cat);
    btns.forEach(b => b.disabled = true);
    btns[i].classList.add('almost');
    btns[p.c].classList.add('right');
    S.answered = true;
    const last = S.qi === S.deck.length - 1;
    el('after').innerHTML =
      `<div class="feedback" role="status" tabindex="-1">${t('correctIsN')(p.c + 1)} ${escapeHTML(d.h2)}</div>
       <button class="bigbtn" id="btnNextQ" type="button">${last ? t('seeResult') : t('nextQ')}</button>`;
    el('after').firstElementChild.focus();
    /* focus אמור לגלול, אבל התנהגותו משתנה בין דפדפנים. כשהמשוב
       ארוך — למשל קופסת 'כמעט' — הכפתור נופל מתחת לקיפול, וזו
       הפעולה שחוזרת יותר מכל אחרת. מבקשים במפורש. */
    if(el('btnNextQ') && el('btnNextQ').scrollIntoView){
      try{ el('btnNextQ').scrollIntoView({ block:'nearest',
        behavior: matchMedia('(prefers-reduced-motion:reduce)').matches ? 'auto' : 'smooth' }); }
      catch(e){ el('btnNextQ').scrollIntoView(); }
    }
    el('btnNextQ').addEventListener('click', () => {
      if(last){ go('result'); return; }
      S.qi++; stopSpeech(); render();
    });
    /* בקול נאמר גם נוסח התשובה הנכונה עצמה. מי שמאזין בלבד לא רואה
       את הירוק, וקודם נאמר לו רק "מסומנת בירוק" — כלומר כלום. */
    speakQueue([t('correctIsN')(p.c + 1), d.o[p.c], d.h2]);
    return;
  }

  /* ---- בתרגול: לא "טעות" — מנטרלים את האפשרות ומעלים רמז ---- */
  recordAnswer(p.cat, false, false);
  if(!S.missed.has(p.id)){ S.missed.add(p.id); recordMistake(p.id, p.cat); }
  btns[i].classList.add('almost');
  btns[i].disabled = true;
  btns[i].insertAdjacentHTML('beforeend', `<span class="tag">${t('almost')}</span>`);
  const nextLevel = Math.min(S.hint + 1, 2);
  showHint(nextLevel, false);
  speakQueue([t('almostSay'), nextLevel >= 2 ? d.h2 : d.h1]);
}

/* =====================================================================
   תאוריה מדברת · חיזוקים
   בלי טבלאות מובילים ובלי רצף ימים — רק תחושת התקדמות.
   הרצף מתאפס בשקט. לעולם אין עונש.
   ===================================================================== */
const REWARD = { streak:0, answered:0, best:0 };

/* =====================================================================
   תאוריה מדברת · רצף ימים
   נשמר לפי תאריך מקומי (לא UTC) — חצות של המשתמש היא מה שקובע.
   ===================================================================== */
const DAY = { streak:0, last:'' };

function dayKey(d){
  d = d || new Date();
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function yesterdayKey(){
  const y = new Date();
  y.setDate(y.getDate() - 1);
  return dayKey(y);
}
function activeToday(){ return DAY.last === dayKey(); }

function saveDayStreak(){
  Store.set('dw-lastday', DAY.last);
  Store.set('dw-daystreak', String(DAY.streak));
}
function loadDayStreak(){
  DAY.last = Store.get('dw-lastday') || '';
  const n = parseInt(Store.get('dw-daystreak'), 10);
  DAY.streak = (Number.isInteger(n) && n > 0) ? n : 0;
  /* הפעילות האחרונה לא היום ולא אתמול — הרצף נגמר */
  if(DAY.last && DAY.last !== dayKey() && DAY.last !== yesterdayKey()){
    DAY.streak = 0;
    saveDayStreak();
  }
}


/* =====================================================================
   תאוריה מדברת · ההתקדמות שלי
   הכול מקומי ואישי. אין טבלת מובילים, אין כינויים, אין דירוג מול אף אחד.
   ההשוואה היחידה היא לשבוע שעבר — ורק כשהיא מחמיאה.
   ===================================================================== */
const HIST = { days:{}, cats:{} };   /* days: יום→שאלות שהושלמו · cats: קטגוריה→{a,c} */

/* שאלות שנגעת בהן היום, נכון או לא. נפרד מ-HIST.days בכוונה:
   שם נספרות רק שאלות שהושלמו, וזה מה שמזין את הרצף ואת מסך
   ההתקדמות. כאן נספר המאמץ, וזה מה שמזין את הסרגל. */
const DAILY_GOAL = 10;
const TOUCHED = { key:null, ids:new Set() };

function touchedToday(){
  const k = dayKey();
  if(TOUCHED.key !== k){ TOUCHED.key = k; TOUCHED.ids = new Set(); saveTouched(); }
  return TOUCHED.ids.size;
}
function touchQuestion(id){
  const k = dayKey();
  if(TOUCHED.key !== k){ TOUCHED.key = k; TOUCHED.ids = new Set(); }
  if(!id || TOUCHED.ids.has(id)) return false;
  TOUCHED.ids.add(id);
  saveTouched();
  return true;
}
function saveTouched(){
  Store.set('dw-touched', JSON.stringify({ k:TOUCHED.key, i:[...TOUCHED.ids] }));
}
function loadTouched(){
  try{
    const o = JSON.parse(Store.get('dw-touched') || 'null');
    if(o && o.k === dayKey() && Array.isArray(o.i)){
      TOUCHED.key = o.k; TOUCHED.ids = new Set(o.i);
    }
  }catch(e){ /* מצב פגום — מתחילים מהיום מאפס */ }
}

function lastNDays(n){
  const out = [];
  for(let i = 0; i < n; i++){
    const d = new Date();
    d.setDate(d.getDate() - i);
    out.push(dayKey(d));
  }
  return out;                         /* [היום, אתמול, ...] */
}
function pruneHistory(){
  const keep = new Set(lastNDays(21));
  Object.keys(HIST.days).forEach(k => { if(!keep.has(k)) delete HIST.days[k]; });
}
function saveHistory(){
  Store.set('dw-history', JSON.stringify({ d:HIST.days, c:HIST.cats }));
}
function loadHistory(){
  try{
    const o = JSON.parse(Store.get('dw-history') || '{}');
    if(o && typeof o.d === 'object' && o.d) HIST.days = o.d;
    if(o && typeof o.c === 'object' && o.c) HIST.cats = o.c;
  }catch(e){ /* היסטוריה פגומה — מתחילים נקי */ }
  pruneHistory();
}

/* completed = שאלה שנסגרה בהצלחה · כל ניסיון נספר לדיוק הקטגוריה */
function recordAnswer(cat, correct, completed){
  if(completed) Metrics.answered();
  if(completed){
    const k = dayKey();
    HIST.days[k] = (HIST.days[k] || 0) + 1;
  }
  if(cat){
    const c = HIST.cats[cat] || (HIST.cats[cat] = { a:0, c:0 });
    c.a++;
    if(correct) c.c++;
  }
  pruneHistory();
  saveHistory();
}

/* offset 0 = שבעת הימים האחרונים · 1 = השבעה שלפניהם */
function weekTotal(offset){
  return lastNDays(14).slice(offset * 7, offset * 7 + 7)
    .reduce((s, k) => s + (HIST.days[k] || 0), 0);
}

/* מנוסחת תמיד לטובה. אם השבוע נמוך יותר — לא אומרים את זה. */
function weekCompare(now, prev){
  if(now === 0 && prev === 0) return t('trkStart');
  /* בשבוע הראשון אין שבוע קודם, ו"יותר משבוע שעבר" נשמע חלול.
     משווים רק כשבאמת היה מה שקדם. */
  if(prev === 0) return t('trkFirst');
  if(now > prev) return t('trkUp')(now - prev);
  return t('trkSteady');
}

function bestCategory(){
  const all = Object.entries(HIST.cats);
  if(!all.length) return null;
  /* קטגוריה נחשבת רק אחרי מספיק תשובות. בלי הסף הזה המסך הכריז
     "הקטגוריה החזקה שלך" אחרי שתי שאלות — אמירה שנשמעת מנופחת,
     ומורידה אמון בכל שאר המספרים במסך. */
  const pool = all.filter(([, v]) => v.a >= 3);
  if(!pool.length) return null;
  pool.sort((a, b) => (b[1].c / b[1].a) - (a[1].c / a[1].a) || b[1].a - a[1].a);
  return { name:pool[0][0], pct:Math.round((pool[0][1].c / pool[0][1].a) * 100) };
}

async function shareProgress(){
  const now = weekTotal(0);
  if(now <= 0) return;                /* אין מה לשתף */
  const url = location.origin + location.pathname;
  const text = t('trkShareText')(now);
  const note = el('trkNote');
  const show = s => { if(note) note.textContent = s; };

  if(navigator.share){
    try{ await navigator.share({ title:t('app'), text, url }); return; }
    catch(e){ if(e && e.name === 'AbortError') return; }
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    try{ await navigator.clipboard.writeText(text + ' ' + url); show(t('chalCopied')); return; }
    catch(e){ /* אין הרשאה */ }
  }
  show(text + ' ' + url);
}

/* נקרא אחרי כל תשובה נכונה. נספר פעם אחת ביום. */
function markDayActivity(){
  const today = dayKey();
  if(DAY.last === today) return;
  DAY.streak = (DAY.last === yesterdayKey()) ? DAY.streak + 1 : 1;
  DAY.last = today;
  saveDayStreak();
  syncFlame();
}

function syncFlame(){
  const f = el('flame');
  if(!f) return;
  f.hidden = DAY.streak < 1;
  f.textContent = '🔥 ' + DAY.streak;
  f.setAttribute('aria-label', t('dayStreakA')(DAY.streak));
}

function loadReward(){
  try{
    const o = JSON.parse(Store.get('dw-reward') || '{}');
    if(Number.isInteger(o.a)) REWARD.answered = o.a;
    if(Number.isInteger(o.b)) REWARD.best = o.b;
  }catch(e){}
}
function saveReward(){
  Store.set('dw-reward', JSON.stringify({ a:REWARD.answered, b:REWARD.best }));
}

function pick(list){ return list[Math.floor(Math.random() * list.length)]; }

/* ציון דרך — רק פעם אחת בכל מספר */
function milestoneFor(n){
  return ({ 10:'milestone10', 25:'milestone25', 50:'milestone50', 100:'milestone100' })[n];
}

/* בוחר את המשפט הנכון לרגע הזה, לפי סדר חשיבות:
   1. ציון דרך   2. רצף   3. עידוד רגיל */
function rewardFor(q){
  REWARD.answered++;
  REWARD.streak++;
  if(REWARD.streak > REWARD.best) REWARD.best = REWARD.streak;
  saveReward();

  const ms = milestoneFor(REWARD.answered);

  if(ms)             return { text: t(ms), big: true };
  if(REWARD.streak >= 3 && REWARD.streak % 3 === 0)
                     return { text: pick(t('cheerStreak')), big: false };
  return { text: q.p || pick(t('cheers')), big: false };
}

function breakStreak(){ REWARD.streak = 0; }

/* =====================================================================
   תאוריה מדברת · "לא הבנתי"
   שולח את השאלה לפונקציה בשרת, שם יושב המפתח. הדפדפן לא רואה אותו.
   נשמר במטמון — הסבר שכבר ניתן חוזר מיד וללא עלות.
   ===================================================================== */
/* enabled:false — הפונקציה בשרת כבר לא קיימת (עברנו ל-GitHub Pages), ולכן
   הכפתור לא מוצג. כל שאר הקוד נשאר במקומו: כדי להחזיר את התכונה מספיק
   להחזיר את השרת ולהחליף כאן ל-true. שימו לב לעדכן גם את privacy.html. */
const EXPLAIN = { url:'/.netlify/functions/explain', enabled:false, cache:{}, busy:false };

function explainKey(id){ return id + '|' + S.lang; }

async function explainQuestion(q){
  const key = explainKey(q.id);
  if(EXPLAIN.cache[key]) return EXPLAIN.cache[key];
  if(!navigator.onLine) throw new Error('offline');

  const r = await fetch(EXPLAIN.url, {
    method:'POST',
    headers:{ 'content-type':'application/json' },
    body: JSON.stringify({
      q: q.q, options: q.o, correct: q.o[q.c], lang: S.lang
    })
  });
  if(!r.ok) throw new Error('http');
  const data = await r.json();
  if(!data.text) throw new Error('empty');

  EXPLAIN.cache[key] = data.text;
  try{ Store.set('dw-explain', JSON.stringify(EXPLAIN.cache)); }catch(e){}
  return data.text;
}

async function doExplain(){
  const q = FLOW.q;
  if(!EXPLAIN.enabled || !q || EXPLAIN.busy) return;
  const box = el('explainBox');
  if(!box) return;

  EXPLAIN.busy = true;
  const btn = el('btnExplain');
  if(btn){ btn.disabled = true; btn.textContent = t('explaining'); }

  try{
    const text = await explainQuestion(q);
    box.innerHTML = `<div class="explainbox" role="status" tabindex="-1">${escapeHTML(text)}</div>`;
    box.firstElementChild.focus();
    speakQueue([text]);
  }catch(e){
    const msg = e.message === 'offline' ? t('explainOff') : t('explainErr');
    box.innerHTML = `<div class="explainbox" role="status">${msg}</div>`;
    if(btn){ btn.disabled = false; btn.textContent = t('explain'); }
  }finally{
    EXPLAIN.busy = false;
  }
}

function karaokeNodes(){

const FLOW = { q:null };

/* שאלות שטעית בהן ועדיין לא תיקנת. משמש למניעת רישום כפול של
   אותה טעות: טועים פעמיים ברצף באותה שאלה — נספרת פעם אחת. */
const WRONG_ONCE = new Set();

function flowHint(level){
  const q = FLOW.q; if(!q) return;
  S.hint = Math.max(S.hint, level);

  if(S.hint >= 1 && q.focus){
    const stage = el('stage');
    if(stage && !stage.querySelector('.spot')) stage.insertAdjacentHTML('beforeend', spotSVG(q.focus));
  }
  const box = el('hints');
  box.innerHTML =
    (S.hint >= 1 && q.h1 ? `<div class="hintbox" tabindex="-1"><b>${t('hint1T')}</b>${escapeHTML(q.h1)}</div>` : '') +
    (S.hint >= 2 && q.h2 ? `<div class="hintbox" tabindex="-1"><b>${t('hint2T')}</b>${escapeHTML(q.h2)}</div>` : '');

  const hb = el('btnHint');
  if(hb){ hb.textContent = t('hint2'); hb.disabled = S.hint >= 2 || !q.h2; }

  const boxes = box.querySelectorAll('.hintbox');
  if(boxes.length){
    boxes[boxes.length-1].focus();
    speakQueue([S.hint >= 2 && q.h2 ? q.h2 : q.h1]);
  }
}

function flowAnswer(i){
  const q = FLOW.q; if(!q) return;
  const btns = [...screen.querySelectorAll('.opt')];
  stopSpeech();

  if(i === q.c){
    btns.forEach(b => b.disabled = true);
    btns[i].classList.add('right','pop');
    const hb = el('btnHint'); if(hb) hb.disabled = true;
    const sb = el('btnSkip'); if(sb) sb.remove();

    /* ענית נכון — הטעות תוקנה, ולכן טעות עתידית באותה שאלה תירשם
       שוב. הסימון הזה נחוץ לספירת הטעויות, לא לעידוד. */
    WRONG_ONCE.delete(q.id);
    touchQuestion(q.id);
    const rw = rewardFor(q);
    markDayActivity();
    recordAnswer(q.cat, true, true);
    /* המספר חייב לזוז ברגע התשובה. אחרת הוא מתעדכן רק בשאלה
       הבאה, והקשר בין הפעולה לתוצאה נשבר. */
    if(S.screen === 'flow') syncDaily();

    el('after').innerHTML =
      `<div class="praise ${rw.big ? 'big' : ''}" role="status" tabindex="-1">${rw.text}${
        REWARD.streak >= 3 ? `<span class="streak">${REWARD.streak} ${t('streakN')}</span>` : ''
      }</div>
       <button class="bigbtn" id="btnNextQ" type="button">${t('nextQ')}</button>`;
    el('after').firstElementChild.focus();
    /* focus אמור לגלול, אבל התנהגותו משתנה בין דפדפנים. כשהמשוב
       ארוך — למשל קופסת 'כמעט' — הכפתור נופל מתחת לקיפול, וזו
       הפעולה שחוזרת יותר מכל אחרת. מבקשים במפורש. */
    if(el('btnNextQ') && el('btnNextQ').scrollIntoView){
      try{ el('btnNextQ').scrollIntoView({ block:'nearest',
        behavior: matchMedia('(prefers-reduced-motion:reduce)').matches ? 'auto' : 'smooth' }); }
      catch(e){ el('btnNextQ').scrollIntoView(); }
    }
    el('btnNextQ').addEventListener('click', () => {
      /* השתמש ברמז? נספר כנכון, אבל בלי לזכות ב"נלמד" */
      if(S.hint > 0) PROG.streak[q.id] = 0;
      scheduleNext(q.id, true);
      stopSpeech(); renderFlow();
    });
    speakQueue([rw.text]);
    return;
  }

  /* טעות: לא מענישים — מכבים את האפשרות ומעלים רמז */
  recordAnswer(q.cat, false, false);
  /* WRONG_ONCE כבר אומר "טעית בשאלה הזו ועדיין לא תיקנת" — בדיוק השמירה
     מפני רישום כפול שצריך כאן, בלי להוסיף מונה שני */
  if(!WRONG_ONCE.has(q.id)) recordMistake(q.id, q.cat);
  WRONG_ONCE.add(q.id);
  breakStreak();
  /* גם טעות היא מגע בשאלה. זו כל הנקודה: המאמץ נספר. */
  touchQuestion(q.id);
  syncDaily();
  btns[i].classList.add('almost');
  btns[i].disabled = true;
  btns[i].insertAdjacentHTML('beforeend', `<span class="tag">${t('almost')}</span>`);

  if(q.h1 || q.h2){
    flowHint(Math.min(S.hint + 1, 2));
  }else{
    /* לשאלה הזאת אין רמז — 76% מהמאגר. עד היום המשתמש קיבל כאן
       תגית "כמעט" על הכפתור וזהו, והמשפט המנחם נאמר בקול בלבד.
       מי שלא מאזין נשאר בלי שום מידע וניחש שוב. */
    el('hints').innerHTML =
      '<div class="almostbox" tabindex="-1">' + escapeHTML(t('almostSay')) + '</div>';
    el('hints').firstElementChild.focus();
    speakQueue([t('almostSay')]);
  }
  PROG.streak[q.id] = 0;   /* טעות מאפסת את הרצף גם אם יתקן */
}

   ולא מועלה לשום מקום — הציון לא עוזב את הטלפון אלא אם המשתמש משתף.
   ===================================================================== */
const SHARE_CARD = {
  w:600, h:400,
  bg:'#0E1F33', gold:'#FFE14D',
  url:'lagstein1-png.github.io/theory',
  fam:'"Rubik","Arial Hebrew","Noto Sans Hebrew","Segoe UI",system-ui,Arial,sans-serif'
};

/* המשפט נקבע לפי האחוז, לא לפי מספר התשובות */
function shareLine(correct, total){
  const pct = total ? (correct / total) * 100 : 0;
  if(pct >= 90) return 'כמעט מושלם!';
  if(pct >= 70) return 'עבר בהצלחה!';
  return 'ממשיכים להתאמן!';
}

function drawShareCard(correct, total){
  const c = document.createElement('canvas');
  c.width = SHARE_CARD.w; c.height = SHARE_CARD.h;
  const x = c.getContext('2d');
  if(!x) return null;

  x.fillStyle = SHARE_CARD.bg;
  x.fillRect(0, 0, SHARE_CARD.w, SHARE_CARD.h);

  x.strokeStyle = SHARE_CARD.gold;
  x.lineWidth = 4;
  x.strokeRect(14, 14, SHARE_CARD.w - 28, SHARE_CARD.h - 28);

  x.fillStyle = SHARE_CARD.gold;
  x.textAlign = 'center';       /* לא תלוי כיוון — עובד ל-RTL ול-LTR */
  x.textBaseline = 'middle';

  x.direction = LANGS[S.lang].dir;
  x.font = 'bold 36px ' + SHARE_CARD.fam;
  x.fillText(t('app'), SHARE_CARD.w / 2, 76);

  x.font = 'bold 118px ' + SHARE_CARD.fam;
  x.fillText(correct + '/' + total, SHARE_CARD.w / 2, 190);

  x.direction = 'rtl';          /* המשפט בעברית */
  x.font = 'bold 40px ' + SHARE_CARD.fam;
  x.fillText(shareLine(correct, total), SHARE_CARD.w / 2, 284);

  x.direction = 'ltr';
  x.font = '22px ' + SHARE_CARD.fam;
  x.fillText(SHARE_CARD.url, SHARE_CARD.w / 2, 348);

  return c;
}

function downloadShareCard(){
  const c = drawShareCard(S.correct, S.deck.length);
  if(!c) return;
  const name = 'talking-theory-' + S.correct + '-' + S.deck.length + '.png';

  const hand = (href, revoke) => {
    const a = document.createElement('a');
    a.href = href; a.download = name; a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    if(revoke) setTimeout(() => URL.revokeObjectURL(href), 60000);
  };

  if(c.toBlob){
    c.toBlob(b => {
      if(b) hand(URL.createObjectURL(b), true);
      else hand(c.toDataURL('image/png'), false);
    }, 'image/png');
  }else{
    hand(c.toDataURL('image/png'), false);
  }
}

/* משתפים זרע בלבד. אין בקישור ניקוד, ואין מה להשוות אליו. */

function currentSpeech(){
  if(S.screen === 'flow'){

      ...(S.hint >= 1 && q.h1 ? [q.h1] : []),
      ...(S.hint >= 2 && q.h2 ? [q.h2] : [])] : null;
  }
  if(S.screen === 'practice' || S.screen === 'exam' || S.screen === 'challenge'){
    const d = PT();
    return [d.q, ...labelledOpts(d.o),
      ...(S.hint >= 1 ? [d.h1] : []),
      ...(S.hint >= 2 ? [d.h2] : [])];
  }
  if(S.screen === 'result'){
    return [t('resT'), t('resLine')(S.correct,S.deck.length), t('resP')];
  }
  return null;
}

function syncPlayUI(){
  const p = el('btnPlay');
  p.classList.toggle('playing', S.playing);
  el('playLabel').textContent = S.playing ? t('stopL') : t('play');
  p.setAttribute('aria-label', S.playing ? t('stopL') : t('play'));
  el('playIcon').innerHTML = S.playing
    ? '<rect x="6" y="5" width="4.5" height="14" rx="1.2"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.2"/>'
    : '<path d="M20 12 6 21V3z"/>';
  p.disabled = !synth; el('btnAgain').disabled = !synth;

  const r = el('btnRate');
  if(r){
    el('rateIcon').textContent = TTS_RATE_ICON[S.ttsRate] || '▶';
    /* התווית אומרת מה המצב עכשיו, ולא רק שהכפתור נוגע במהירות */
    const lab = el('rateLabel');
    lab.textContent = t(TTS_RATE_LABEL[S.ttsRate] || 'spNormal');
    /* מכווצים רק כשצריך, ולא מקטינים את כל השפות בגלל אחת */
    lab.classList.remove('tight');
    if(lab.scrollWidth > lab.clientWidth) lab.classList.add('tight');
    r.setAttribute('aria-label', t('rateA')(S.ttsRate));
  }
}

function cycleTtsRate(){
  const i = TTS_RATES.indexOf(S.ttsRate);
  S.ttsRate = TTS_RATES[(i + 1) % TTS_RATES.length];
  Store.set('dw-ttsrate', String(S.ttsRate));
  syncPlayUI();
}
function loadTtsRate(){
  const v = parseFloat(Store.get('dw-ttsrate'));
  if(TTS_RATES.includes(v)) S.ttsRate = v;
}
function playCurrent(){
  voice = pickVoice();
  const q = currentSpeech(); if(q) speakQueue(q);
}

el('btnPlay').addEventListener('click', () => S.playing ? stopSpeech() : playCurrent());
el('btnAgain').addEventListener('click', () => playCurrent());
el('btnRate').addEventListener('click', () => {
  cycleTtsRate();
  /* משנים באמצע משפט — משמיעים אותו מחדש בקצב החדש, אחרת השינוי
     מורגש רק בשאלה הבאה והמשתמש חושב שהכפתור לא עשה כלום. */
  if(S.playing) playCurrent();
});
el('btnBack').addEventListener('click', () => {
  go('home');
});

/* ניתוב אירועים מרוכז */
screen.addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]');
  if(nav){ go(nav.dataset.nav, nav.dataset.i !== undefined ? +nav.dataset.i : undefined); return; }
  /* מתג פשוט למשתמש: "קול טבעי" = קבצים מוקלטים, "קול המכשיר" = מנוע מקומי */
  const vm = e.target.closest('[data-vmode]');
  if(vm){
    STATIC.on = vm.dataset.vmode === 'natural';
    STATIC.missing.clear(); stopSpeech(); save(); render(); return;
  }
  const st = e.target.closest('[data-static]');
  if(st){
    STATIC.on = st.dataset.static === '1';
    STATIC.missing.clear(); save(); render(); return;
  }
  if(e.target.closest('#btnExportList')){ exportAudioList(); return; }
  if(e.target.closest('#btnTestKey')){ testVoice(); return; }
  if(e.target.closest('#btnTrkShare')){ shareProgress(); return; }
  if(e.target.closest('#btnChalShare')){ shareChallenge(); return; }
  if(e.target.closest('#btnShare')){ downloadShareCard(); return; }
  if(e.target.closest('#btnExplain')){ doExplain(); return; }
  if(e.target.closest('#btnTipTest')){ tipVoiceTest(); return; }
  if(e.target.closest('#btnTipOk')){ dismissTip(); render(); return; }
  if(e.target.closest('#btnInstall')){ doInstall(); return; }
  /* החלפת קול מוקלט. משמיעים מיד משפט קצר — כך לא צריך לזכור
     איזה קול הוא 'א' ואיזה 'ב', פשוט שומעים. */
  const av = e.target.closest('[data-avoice]');
  if(av){
    const id = av.dataset.avoice;
    if(!AUDIO_VOICES.some(v => v.id === id)) return;
    S.audioVoice = id; save(); stopSpeech();
    probeStatic().then(() => { render(); speakQueue([t('testOK')]); });
    return;
  }
  /* החלפת נושא. התור נבנה מחדש, אבל ההתקדמות לא נמחקת — היא נשמרת
     לכל שאלה בנפרד, ולכן חזרה לנושא קודם ממשיכה מאיפה שהפסקת. */
  const cc = e.target.closest('[data-cat]');
  if(cc){
    const v = cc.dataset.cat || '';
    if(v === S.cat) return;
    S.cat = v;
    PROG.saved = null;      /* התור השמור שייך לנושא הקודם */
    buildQueue(); saveProg(); save(); render();
    return;
  }
  const lang = e.target.closest('[data-lang]');
  if(lang){
    const code = lang.dataset.lang;
    if(!LANGS[code]) return;              /* שפה לא מוכרת — מתעלמים */
    S.lang = code; voice = pickVoice(); stopSpeech(); save();
    loadBank().then(() => { buildAudioMap(); probeStatic(); buildQueue(); render(); });
    render(); return;
  }
  const size = e.target.closest('[data-size]');
  if(size){ S.size = +size.dataset.size; save(); render(); return; }
  const rst = e.target.closest('#btnReset');
  if(rst){
    if(rst.dataset.armed){
      PROG.streak = {}; PROG.mastered = {}; PROG.saved = null;
      MISTAKES.items = {};   /* מחיקת התקדמות מוחקת גם את הטעויות */
      buildQueue(); saveProg(); saveMistakes(); save(); render();
    }
    else { rst.dataset.armed = '1'; rst.textContent = t('resetAsk'); }
    return;
  }
  const fa = e.target.closest('[data-flow]');
  if(fa && !fa.disabled){ flowAnswer(+fa.dataset.flow); return; }
  if(e.target.closest('#btnHint')){
    S.screen === 'flow' ? flowHint(S.hint + 1) : showHint(S.hint + 1, true);
    return;
  }
  if(e.target.closest('#btnSkip')){
    /* דילוג אינו תשובה שגויה, ולכן אינו נספר ביחס הנכונות ואינו נספר
       ביעד היומי — לא הייתה כאן עבודה. אבל השאלה חוזרת: דילוג הוא
       לא דרך למחוק שאלה מהחפיסה. */
    stopSpeech();
    if(S.screen === 'flow'){
      if(FLOW.q) scheduleNext(FLOW.q.id, false);
      renderFlow();
      return;
    }
    const q = P();
    if(!S.missed.has(q.id)){ S.missed.add(q.id); recordMistake(q.id, q.cat); }
    if(S.qi === S.deck.length - 1){ go('result'); return; }
    S.qi++; render();
    return;
  }
  const ans = e.target.closest('[data-ans]');
  if(ans && !ans.disabled){ answerPractice(+ans.dataset.ans); return; }
  const qz = e.target.closest('[data-quiz]');
  if(qz && !qz.disabled){ answerQuiz(+qz.dataset.quiz); return; }
});
window.addEventListener('beforeunload', () => { if(synth) synth.cancel(); });

load();
loadProg();
loadMistakes();
loadReward();
loadDayStreak();
loadHistory();
loadTtsRate();
loadTouched();
loadSpeechRules();
try{ EXPLAIN.cache = JSON.parse(Store.get('dw-explain') || '{}'); }catch(e){}
buildAudioMap();
voice = pickVoice();
render();
Metrics.open();
/* המאגר נטען ברקע — האפליקציה כבר עובדת עם השאלות המובנות */
/* כשהמאגר המלא מגיע, התור נבנה מחדש. אם המשתמש כבר במסך הרצף, צריך
   לרענן — אחרת נשארת על המסך שאלה מהמאגר המובנה. לא מרעננים באמצע
   תשובה, כדי לא למחוק מתחת ליד. */
loadBank().then(() => {
  buildAudioMap(); probeStatic();
  buildQueue();
  if(S.screen === 'home' || (S.screen === 'flow' && !S.answered)) render();
});
})();
</script>
