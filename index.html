<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talking Theory | תאוריה מדברת</title>
<meta name="theme-color" content="#0E1F33">
<!-- Manifest כקובץ אמיתי: Bubblewrap חייב כתובת שאפשר למשוך, ו-Data URL אינו כזה.
     האייקונים עדיין נבנים בזמן ריצה עבור הדפדפן (fav/ati), אבל ב-manifest יושבים
     קבצי PNG — הכלים של אנדרואיד לא יודעים לקרוא SVG. -->
<link rel="manifest" href="manifest.json">
<link rel="icon" id="fav">
<link rel="apple-touch-icon" id="ati">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Talking Theory">
<meta name="description" content="לימוד תאוריה בהקראה קולית, נגיש בארבע שפות">
<link rel="canonical" href="https://lagstein1-png.github.io/theory/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Talking Theory | תאוריה מדברת">
<meta property="og:title" content="Talking Theory | תאוריה מדברת">
<meta property="og:description" content="לימוד תאוריה בהקראה קולית, נגיש בארבע שפות">
<meta property="og:url" content="https://lagstein1-png.github.io/theory/">
<meta property="og:locale" content="he_IL">
<meta name="twitter:card" content="summary">
<style>
:root{
  --paper:#E7EDF4;
  --card:#FFFFFF;
  --ink:#0E1F33;
  --ink-dim:#5A6B7E;
  --gold:#FFE14D;
  --gold-edge:#D9A400;
  --gold-soft:#FFF6D6;
  --go:#12703A;
  --go-dark:#0B4A26;
  --quiet:#9FB0C2;
  --quiet-bg:#EEF2F7;
  --lane:#C4D1DE;
  --focus:#0B5FD0;
  /* גופני מערכת בלבד — אפס בקשות רשת, טעינה מיידית גם לגמרי לא מקוון */
  --display:"Rubik","Arial Hebrew","Noto Sans Hebrew","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --body:"Assistant","Arial Hebrew","Noto Sans Hebrew",system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --read:29px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);display:flex;justify-content:center}
.app{width:100%;max-width:600px;min-height:100%;display:flex;flex-direction:column;
  background:var(--card);box-shadow:0 0 0 1px rgba(14,31,51,.07)}

/* ================= HEADER ================= */
.bar{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:3px solid var(--paper)}
.brandwrap{flex:1;min-width:0}
.brand{font-family:var(--display);font-weight:800;font-size:20px;margin:0;letter-spacing:-.2px}
/* שורת המותג הלועזית. קטנה במוד, אבל לא מתחת לסף הקריאות — 12px עם
   ניגודיות מלאה על רקע הכרטיס, לא אפור דהוי. */
.brandsub{font-family:var(--display);font-weight:700;font-size:12px;line-height:1.2;
  letter-spacing:.06em;color:var(--ink-dim);margin-top:2px}
.brandsub[hidden]{display:none}
.pill{font-family:var(--display);font-weight:700;font-size:15px;background:var(--paper);
  color:var(--ink-dim);padding:6px 12px;border-radius:999px;white-space:nowrap}
.flame{font-family:var(--display);font-weight:800;font-size:15px;background:var(--gold-soft);
  color:var(--ink);padding:6px 11px;border-radius:999px;white-space:nowrap;
  border:2px solid var(--gold-edge)}
.flame[hidden]{display:none}
.daycheer{background:var(--gold-soft);border:3px solid var(--gold-edge);border-radius:16px;
  padding:14px 16px;margin-bottom:14px;font-weight:700;font-size:18px;line-height:1.5}
.daynote{background:var(--quiet-bg);border-radius:16px;padding:14px 16px;margin-bottom:14px;
  color:var(--ink);font-size:18px;line-height:1.5}
.chalinvite{background:var(--ink);color:#fff;border-radius:18px;padding:16px 18px;
  margin-bottom:16px;font-weight:700;font-size:19px;line-height:1.5}
.chalmsg{background:var(--gold-soft);border:3px solid var(--gold-edge);border-radius:18px;
  padding:16px 18px;margin:0 0 14px;font-weight:700;font-size:20px;line-height:1.5}
.chalnote{font-size:15px;color:var(--ink-dim);word-break:break-all;margin:8px 0 0}
.trkbig{font-family:var(--display);font-weight:800;font-size:72px;line-height:1;
  text-align:center;color:var(--go);margin:6px 0 2px}
.trklabel{text-align:center;font-size:18px;color:var(--ink-dim);margin:0 0 14px}
.trknote{background:var(--quiet-bg);border-radius:16px;padding:14px 16px;
  font-size:18px;line-height:1.5;margin-bottom:14px}
.dots{display:flex;gap:10px;justify-content:center;margin-bottom:14px}
.dot{width:26px;height:26px;border-radius:50%;background:var(--lane);
  border:3px solid var(--lane)}
.dot.on{background:var(--go);border-color:var(--go-dark)}
/* קריוקי — הריפוד מקוזז במרג' שלילי כדי שהעטיפה לא תזיז את הטקסט,
   ואין שום מעבר: אנימציה גונבת את הקשב בדיוק מהמשתמשים שהיא נועדה לשרת */
.kw{padding:0 2px;margin:0 -2px;border-radius:3px;transition:none}
.kw.on{background:#FFE14D;color:#0E1F33;transition:none}
.kwhole{background:#FFE14D;color:#0E1F33;border-radius:3px;padding:0 2px;
  margin:0 -2px;transition:none}
.rateicon{font-size:20px;line-height:1}
.iconbtn{min-width:64px;min-height:64px;display:flex;align-items:center;justify-content:center;
  background:var(--card);border:3px solid var(--ink);border-radius:14px;color:var(--ink);cursor:pointer}
.iconbtn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
html[dir="ltr"] .backicon{transform:scaleX(-1)}

/* ================= SCREEN ================= */
.screen{flex:1;padding:20px 18px 28px}
/* סרגל ההקראה דביק לתחתית ומכסה את סוף התוכן. בלי הריפוד הזה
   הכפתור שמופיע אחרי כל תשובה נופל מתחת לקיפול, והמשתמש נאלץ
   לגלול — אחרי כל שאלה מחדש. הריפוד נכנס רק כשהסרגל באמת מוצג. */
body.hasbar .screen{padding-bottom:136px}
@media (max-width:420px){ body.hasbar .screen{padding-bottom:124px} }
.hero{background:var(--ink);color:#fff;border-radius:22px;padding:24px 22px;margin-bottom:22px}
.hero h2{font-family:var(--display);font-weight:800;font-size:27px;line-height:1.35;margin:0 0 8px}
.hero p{margin:0;font-size:19px;line-height:1.6;opacity:.86}

.bigbtn{display:block;width:100%;min-height:84px;margin-bottom:14px;
  font-family:var(--display);font-size:23px;font-weight:700;
  background:var(--go);color:#fff;border:0;border-radius:20px;cursor:pointer;box-shadow:0 5px 0 var(--go-dark)}
.bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--go-dark)}
.bigbtn.dark{background:var(--ink);box-shadow:0 5px 0 #05101D}
.bigbtn.dark:active{box-shadow:0 2px 0 #05101D}
.bigbtn.ghost{background:var(--card);color:var(--ink);border:3px solid var(--ink);box-shadow:none}
.bigbtn.ghost:active{transform:none}

.duo{display:flex;gap:14px;margin-bottom:22px}
.duo .bigbtn{margin-bottom:0}

.grouptitle{font-family:var(--display);font-weight:700;font-size:17px;color:var(--ink-dim);margin:22px 0 10px}


.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{min-height:72px;padding:0 22px;font-family:var(--display);font-size:18px;font-weight:700;
  background:var(--card);color:var(--ink);border:3px solid var(--ink);border-radius:16px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.chipn{font-size:14px;font-weight:400;opacity:.6;font-variant-numeric:tabular-nums}
.noticebtn{display:block;margin-top:10px;min-height:52px;padding:0 20px;font-family:var(--display);
  font-size:17px;font-weight:700;background:var(--ink);color:#fff;border:0;border-radius:14px;cursor:pointer}

/* ================= SIGN + SPOTLIGHT ================= */
.stage{margin:0 auto 6px;padding:8px 0 6px;position:relative;width:150px;height:158px;max-width:100%}
.stage:has(.qimg){width:100%;height:auto}
.stage .sign,.stage .spot{position:absolute;inset:8px 0 6px;width:150px;height:150px}
.spot{pointer-events:none}
.spot .ring{animation:pulse 1.7s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.road{position:relative;height:16px;margin:10px 0 20px;background:#2C3B4D;border-radius:8px;overflow:hidden}
.road::after{content:"";position:absolute;inset:0;top:50%;height:3px;margin-top:-1.5px;
  background:repeating-linear-gradient(to left,var(--lane) 0 16px,transparent 16px 32px);opacity:.55}
.road-fill{position:absolute;top:0;bottom:0;inset-inline-end:0;width:0%;
  background:var(--gold);border-inline-start:3px solid var(--gold-edge);transition:width .35s ease}

/* ================= QUESTIONS ================= */
.qimg{max-width:100%;max-height:230px;border-radius:16px;display:block;margin:0 auto}
/* גודל הטקסט של השאלה והתשובות נגזר מ---read, שנקבע בכפתורי "גודל טקסט".
   היחסים שומרים על המידות המקוריות (26/22) בהגדרה "רגיל". */
.qtitle{font-family:var(--display);font-weight:700;font-size:calc(var(--read, 29px) * .9);line-height:1.6;margin:0 0 18px}
.optnum{flex:0 0 auto;align-self:flex-start;min-width:34px;height:34px;display:flex;
  align-items:center;justify-content:center;border-radius:10px;background:var(--quiet-bg);
  color:var(--ink-dim);font-family:var(--display);font-size:17px;font-weight:700}
.opt.right .optnum,.opt.wrong .optnum{background:rgba(255,255,255,.85);color:var(--ink)}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:start;
  font-family:var(--body);font-size:calc(var(--read, 29px) * .76);font-weight:600;line-height:1.5;
  padding:20px 22px;margin-bottom:14px;min-height:96px;
  background:var(--card);color:var(--ink);border:3px solid var(--ink);border-radius:16px;cursor:pointer}
.opt span{flex:1}
.opt .tag{flex:0 0 auto;font-family:var(--display);font-size:15px;font-weight:700}
.opt.right{background:var(--go);border-color:var(--go);color:#fff}
.opt.almost{background:var(--quiet-bg);border-color:var(--quiet);color:var(--ink-dim)}

/* משוב על טעות בשאלה שאין לה רמז. עד היום הוא נאמר בקול בלבד,
   ולכן מי שלא מאזין — ורוב האנשים לא מאזינים כל הזמן — קיבל רק
   תגית "כמעט" קטנה על הכפתור, ושום מידע חדש. */
.almostbox{background:var(--paper);border:3px solid var(--line);border-radius:18px;
  padding:16px 18px;margin:0 0 14px;font-size:var(--read);line-height:1.6}

/* מרווח בין קבוצות. קודם שימשה כאן כותרת קבוצה ריקה עם &nbsp;,
   כלומר אלמנט טקסט בלי טקסט — קורא מסך הכריז עליו כפסקה ריקה. */
.spaced{margin-top:26px}

.hintbox{background:var(--gold-soft);border:3px solid var(--gold-edge);border-radius:18px;
  padding:18px 20px;margin-bottom:16px;font-size:21px;font-weight:600;line-height:1.6}
.hintbox b{font-family:var(--display);display:block;font-size:16px;color:#8A6A00;margin-bottom:6px}
.hintbox:focus{outline:4px solid var(--focus);outline-offset:3px}
.praise:focus,.feedback:focus{outline:4px solid var(--focus);outline-offset:3px}
.hintbtn{display:block;width:100%;min-height:96px;margin-bottom:16px;
  font-family:var(--display);font-size:22px;font-weight:700;
  background:var(--gold);color:var(--ink);border:3px solid var(--gold-edge);border-radius:20px;cursor:pointer}
/* ================= REWARD ================= */
@keyframes pop{
  0%{transform:scale(1)}
  40%{transform:scale(1.04)}
  100%{transform:scale(1)}
}
.opt.pop{animation:pop .38s ease-out}
@media (prefers-reduced-motion:reduce){ .opt.pop{animation:none} }

.praise.big{background:var(--gold-soft);border-color:var(--gold-edge);font-size:26px}
.streak{display:block;margin-top:10px;font-family:var(--display);font-size:18px;
  font-weight:700;color:var(--go);opacity:.9}
.praise.big .streak{color:#8A6A00}

.praise{background:#F1F8F3;border:3px solid var(--go);border-radius:18px;padding:20px;
  font-size:23px;font-weight:600;line-height:1.6;color:#0B4A26;margin-bottom:16px}
.feedback{font-size:22px;font-weight:600;line-height:1.6;padding:18px;border-radius:16px;
  background:var(--paper);border-inline-start:8px solid var(--gold-edge);margin-bottom:16px}

/* ================= RESULT ================= */
.medal{width:130px;height:130px;display:block;margin:0 auto 6px}
.result{text-align:center;padding-top:10px}
.result h2{font-family:var(--display);font-weight:800;font-size:34px;margin:0 0 10px}
.result h2:focus{outline:4px solid var(--focus);outline-offset:6px;border-radius:8px}
.score{font-family:var(--display);font-weight:800;font-size:64px;line-height:1;color:var(--go);margin:14px 0 6px}
.result p{font-size:21px;font-weight:600;line-height:1.6;margin:0 0 22px}
.stars{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.stars svg{width:38px;height:38px}

.installbtn{display:flex;align-items:center;justify-content:center;gap:14px;
  width:100%;min-height:96px;margin-bottom:22px;
  font-family:var(--display);font-size:22px;font-weight:700;
  background:var(--gold);color:var(--ink);border:3px solid var(--gold-edge);
  border-radius:20px;cursor:pointer}
.installbtn svg{width:30px;height:30px;flex:0 0 30px;fill:none;stroke:currentColor;
  stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.offbadge{display:flex;align-items:center;gap:10px;margin-bottom:18px;
  padding:12px 16px;border-radius:14px;background:var(--quiet-bg);
  border:2px solid var(--quiet);font-size:17px;font-weight:600;color:var(--ink)}
.offbadge svg{width:22px;height:22px;flex:0 0 22px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}

/* ================= VOICE SETTINGS ================= */
.field{margin-bottom:18px}
.field label{display:block;font-family:var(--display);font-weight:700;
  font-size:17px;color:var(--ink-dim);margin-bottom:8px}
.field input{width:100%;min-height:72px;padding:0 18px;
  font-family:var(--body);font-size:20px;font-weight:600;
  color:var(--ink);background:var(--card);
  border:3px solid var(--ink);border-radius:16px}
.field input:focus{outline:4px solid var(--focus);outline-offset:3px}
.warnbox{background:var(--gold-soft);border:3px solid var(--gold-edge);
  border-radius:18px;padding:18px 20px;margin-bottom:20px;
  font-size:18px;font-weight:600;line-height:1.6}
.status{font-size:20px;font-weight:600;line-height:1.6;padding:16px 18px;
  border-radius:16px;margin-bottom:16px;background:var(--quiet-bg);border:2px solid var(--quiet)}
.status.ok{background:#F1F8F3;border-color:var(--go);color:#0B4A26}

.explainbtn{display:block;width:100%;min-height:96px;margin-bottom:16px;
  font-family:var(--display);font-size:22px;font-weight:700;
  background:var(--card);color:var(--ink);
  border:3px dashed var(--ink);border-radius:20px;cursor:pointer}
.explainbtn:disabled{opacity:.5}
.explainbox{background:#EEF4FB;border:3px solid #1B4FA0;border-radius:18px;
  padding:18px 20px;margin-bottom:16px;
  font-size:22px;font-weight:600;line-height:1.7;color:var(--ink)}
.explainbox:focus{outline:4px solid var(--focus);outline-offset:3px}

/* ================= VOICE TIP ================= */
.vtip{background:var(--gold-soft);border:3px solid var(--gold-edge);border-radius:18px;
  padding:18px 20px;margin-bottom:18px}
.vtip h3{font-family:var(--display);font-size:20px;font-weight:700;margin:0 0 10px}
.vtip pre{margin:0 0 14px;font-family:var(--body);font-size:18px;font-weight:600;
  line-height:1.75;white-space:pre-wrap}
.vtip button{min-height:64px;padding:0 26px;font-family:var(--display);font-size:18px;
  font-weight:700;background:var(--card);color:var(--ink);
  border:3px solid var(--ink);border-radius:14px;cursor:pointer}
.vtip:focus{outline:4px solid var(--focus);outline-offset:3px}
/* הגרסה המצומצמת: אחרי שהטיפ נסגר נשאר רק כפתור הבדיקה, בלי צבע
   שצועק ובלי כותרת — נוכח אבל לא מציק. */
.vtip.vtipmini{background:var(--card);border-color:var(--lane);padding:12px 14px;margin-bottom:14px}
.vtip.vtipmini .vtiptest{margin:0}
.vtip.vtipmini .vtipstat{margin:12px 0 0}
.vtip .vtiptest{display:block;width:100%;margin:0 0 12px}
.vtip .vtipstat{margin:0 0 14px;padding:14px 16px;border-radius:14px;
  background:var(--card);border:2px solid var(--quiet);
  font-size:18px;font-weight:700;line-height:1.6}
.vtip .vtipstat:empty{display:none}
.vtip .vtipstat.good{background:#F1F8F3;border-color:var(--go);color:#0B4A26}
.vtip .vtipstat.bad{background:#FFF1F0;border-color:#B3261E;color:#8C1D18}
.vtip details{margin:0 0 14px}
.vtip summary{min-height:56px;display:flex;align-items:center;gap:10px;
  font-family:var(--display);font-size:18px;font-weight:700;cursor:pointer;
  text-decoration:underline;text-underline-offset:5px}
.vtip summary::-webkit-details-marker{display:none}
.vtip summary::before{content:"▸";font-size:20px;line-height:1}
.vtip details[open] summary::before{content:"▾"}
.vtip summary:focus-visible{outline:4px solid var(--focus);outline-offset:3px}

.notice{margin-bottom:16px;padding:14px 16px;border-radius:14px;background:var(--gold-soft);
  border:2px solid var(--gold-edge);font-size:17px;font-weight:600;line-height:1.55}

/* ================= ACTION BAR ================= */
.actions{position:sticky;bottom:0;background:var(--card);border-top:3px solid var(--paper);
  padding:14px 18px calc(14px + env(safe-area-inset-bottom));
  display:flex;align-items:center;justify-content:center;gap:16px}
.side{flex:0 0 auto;min-width:96px;min-height:96px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;font-family:var(--display);font-size:16px;
  font-weight:700;text-align:center;background:var(--card);color:var(--ink);
  border:3px solid var(--ink);border-radius:20px;cursor:pointer}
.side svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.side[aria-pressed="true"]{background:var(--ink);color:#fff}
/* בקרת המהירות מחליפה תווית בכל לחיצה ("איטי" / "רגיל" / "מהיר").
   רוחב קבוע כדי שהכפתור לא ישנה גודל מתחת לאצבע, ותווית שמתכווצת
   מעט כשהמילה ארוכה — "Медленно" ברוסית לא נכנסת אחרת. */
#btnRate{width:96px}
#rateLabel{max-width:100%;overflow:hidden;white-space:nowrap}
#rateLabel.tight{font-size:0.8em}
.play{flex:0 0 auto;width:96px;height:96px;border-radius:50%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;font-family:var(--display);font-size:15px;
  font-weight:700;background:var(--go);color:#fff;border:0;cursor:pointer;box-shadow:0 5px 0 var(--go-dark)}
.play svg{width:34px;height:34px;fill:currentColor;stroke:none}
.play.playing{background:var(--ink);box-shadow:0 5px 0 #05101D}
.play:active{transform:translateY(3px);box-shadow:0 2px 0 var(--go-dark)}

button:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
button:disabled{cursor:default}
.hintbtn:disabled{opacity:.4}
[hidden]{display:none !important}

@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
@media (max-width:380px){
  .play{width:88px;height:88px}
  .side{min-width:78px;min-height:78px;font-size:15px}

/* =====================================================================

function escapeHTML(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}


/* נתיב תמונה מהמאגר — יחסי או http(s) בלבד. חוסם javascript: ו-data: */
function safeImgSrc(src){
  if(typeof src !== 'string' || !src.trim()) return '';
  const s = src.trim();
  if(s.startsWith('//')) return '';
  if(/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(s)){
    try{
      const p = new URL(s, location.href);
      return (p.protocol === 'http:' || p.protocol === 'https:') ? s : '';
    }catch(e){ return ''; }
  }
  return s;
}

async function loadBank(){

    const wellFormed = arr.filter(x => x && x.id && x.q && Array.isArray(x.o)

    const ok = wellFormed.filter(answerable);

  }catch(e){ /* אין קובץ, אין רשת — נשארים עם המובנות */ }

  /* שכבת הרמזים — קובץ נפרד, אופציונלי לחלוטין.
     מבנה: { "q0760": {"h1":"...","h2":"...","p":"..."}, ... }

const PROG = { streak:{}, queue:[], mastered:{}, saved:null };

const GAP_WRONG = 6;    /* אחרי טעות — חוזרת בעוד כמה שאלות */
/* אחרי תשובה נכונה השאלה נדחפה קודם לסוף התור, כלומר חזרה רק
   אחרי כל 1,270 השאלות. בפועל זה אמר שאף שאלה לא הגיעה לעולם
   לתשובה הנכונה השנייה, ו"נלמד" נשאר אפס לנצח. מרווח סביר גם
   נכון יותר: חזרה שלא חוזרת אינה חזרה. */
const GAP_RIGHT = 60;
const MASTER_AT = 2;    /* שתי תשובות נכונות ברצף = נלמד */
/* בחינת התאוריה בישראל: 30 שאלות, עוברים עם 26 נכונות. מסך
   הסיום אמר "כל הכבוד" בכל תוצאה, ולא ענה על השאלה היחידה
   שהמשתמש שואל אחרי בחינת תרגול. */
const EXAM_PASS = 26;

function shuffle(a){
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* =====================================================================
   תאוריה מדברת · אתגר עצמי
   אותו זרע ⇐ אותן עשר שאלות, אצל כל מי שפותח את הקישור.
   אין ניקוד של מישהו אחר, אין השוואה, אין דירוג. רק המסלול שלך.
   ===================================================================== */
const CHALLENGE = { seed:'', active:false, fromFriend:false, LEN:10 };

/* mulberry32 — קטן, יציב, ואותה סדרה בכל דפדפן */
function seededRandom(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function seedFromString(s){
  let h = 5381;
  for(let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
  return h >>> 0;
}
function seededShuffle(list, rnd){
  const a = [...list];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function newSeed(){
  return Math.floor(Math.random() * Math.pow(36, 5)).toString(36).padStart(5, '0');
}
function challengeUrl(seed){
  return location.origin + location.pathname + '?challenge=' + encodeURIComponent(seed);
}

/* אותה צורה שמחזיר deckFromBank, כדי שמסך התרגול יעבוד בלי שינוי */
function challengeDeck(seed){
  const rnd = seededRandom(seedFromString(seed));
  return seededShuffle(BANK.items, rnd).slice(0, CHALLENGE.LEN).map(q => ({
    id:q.id, sign:q.sign, img:q.img, focus:q.focus, c:q.c, cat:q.cat,

  }));
}

/* המשוב נקבע לפי אחוז אישי בלבד — לא מול אף אחד */
function challengeLine(correct, total){

  if(pct >= 90) return t('chal90');

/* קישור נכנס: קוראים רק את הזרע. אין בקישור ניקוד ואין מה לקרוא ממנו. */
(function readChallengeParam(){

function buildQueue(){
  const inCat = BANK.items.filter(x => !S.cat || x.cat === S.cat);
  /* נושא שנבחר ואינו קיים במאגר — חוזרים להכול במקום למסך ריק */
  const pool = inCat.length ? inCat : BANK.items;
  const valid = new Set(pool.map(x => x.id));

  /* המאגר עוד לא נטען. בונים תור על מאגר ריק — ומוחקים את התור השמור
     בדרך. יוצאים ומחכים ש-loadBank יקרא לנו שוב. */
  if(!valid.size) return;

  /* יש תור שמור מהפעם הקודמת? ממשיכים מאותן שאלות — אבל בסדר מעורבב,
     כדי שכל כניסה תרגיש אחרת ולא תשחזר את אותו רצף. */
  if(PROG.saved && PROG.saved.length){
    const kept = PROG.saved.filter(id => valid.has(id) && !PROG.mastered[id]);
    if(kept.length){
      PROG.saved = null;
      PROG.queue = shuffle(kept);
      return;
    }
    /* אף מזהה לא נמצא. אם רץ כרגע רק המאגר המובנה, סביר שהמאגר המלא
       עדיין בדרך — משאירים את התור השמור לניסיון הבא במקום לאבד אותו. */
    if(BANK.source === 'file') PROG.saved = null;
  }

  /* סבב חדש — מערבבים, כדי שלא יהיה משעמם */
  const fresh = [...valid].filter(id => !PROG.mastered[id]);
  /* נגמר הנושא — כל שאלותיו נלמדו. פותחים סבב חדש על אותו נושא
     במקום להשאיר מסך ריק. עם 106 שאלות ב"הכרת הרכב" זה מצב שיקרה,
     ועם 1,273 בלי סינון הוא כמעט ולא קרה — ולכן לא נראה עד היום. */
  PROG.queue = shuffle(fresh.length ? fresh : [...valid]);
}


  function deckFromBank(n){
  const pool = shuffle([...BANK.items]);
  return pool.slice(0, n).map(q => ({
    id:q.id, sign:q.sign, img:q.img, focus:q.focus, c:q.c, cat:q.cat,
    text:{ [S.lang]:{ q:q.q, o:q.o, h1:q.h1||'', h2:q.h2||'', p:q.p||'' } }
  }));
}

/* אותה צורת חפיסה, מרשימת מזהים נתונה. לא מערבבים: mistakeIds כבר מסדר
   את הטעויות מהאחרונה לראשונה, וזה הסדר שהכי הגיוני לחזור עליו. */
function deckFromIds(ids, n){
  return ids.slice(0, n)
    .map(id => BANK.items.find(x => x.id === id))
    .filter(Boolean)                 /* מזהה שנעלם בין הקריאה לבנייה — מדלגים */
    .map(q => ({
      id:q.id, sign:q.sign, img:q.img, focus:q.focus, c:q.c, cat:q.cat,
      text:{ [S.lang]:{ q:q.q, o:q.o, h1:q.h1||'', h2:q.h2||'', p:q.p||'' } }
    }));
}
  function currentQ(){
  if(!PROG.queue.length) buildQueue();
  const id = PROG.queue[0];
  return BANK.items.find(x => x.id === id) || null;
}

/* מכניס את השאלה חזרה לתור, או מוציא אותה לגמרי.
   נכון → לסוף התור, כדי שתמיד תקבל שאלה חדשה.
   טעות → חוזרת מהר, כדי שתתקן בזמן שהיא עוד טרייה. */
function scheduleNext(id, correct){
  PROG.queue.shift();
  const st = correct ? (PROG.streak[id] || 0) + 1 : 0;
  PROG.streak[id] = st;

  if(correct && st >= MASTER_AT){
    PROG.mastered[id] = 1;
  }else if(correct){
    PROG.queue.splice(Math.min(GAP_RIGHT, PROG.queue.length), 0, id);
  }else{
    PROG.queue.splice(Math.min(GAP_WRONG, PROG.queue.length), 0, id);
  }
  if(!PROG.queue.length) buildQueue();   /* סיים הכול — מתחילים סבב חדש */
  saveProg();
}

function masteredCount(){ return Object.keys(PROG.mastered).length; }

/* כמה שאלות נענו היום. HIST.days כבר נאסף עבור מסך ההתקדמות. */
function answeredToday(){ return (HIST.days && HIST.days[dayKey()]) || 0; }

/* מזיז את המספר ואת הסרגל יחד. נקרא ברגע התשובה ולא ברינדור
   הבא, כי הקשר בין הפעולה לתוצאה נשבר אם הוא מאחר. */
function syncDaily(){
  const n = touchedToday();
  const p = el('pill'); if(p) p.textContent = t('todayN')(n);
  const f = el('dailyFill');
  if(f){
    f.style.width = Math.min(100, n / DAILY_GOAL * 100) + '%';
    const road = f.parentElement;
    if(road) road.setAttribute('aria-valuenow', String(Math.min(n, DAILY_GOAL)));
  }
}

/* האם המשתמש כבר התחיל? REWARD.answered נשמר בין הפעלות ומכסה
   את כל המצבים — תרגול, בחינה, וזרימת הלימוד. */
function hasProgress(){ return REWARD.answered > 0 || masteredCount() > 0; }

function saveProg(){

  Store.set('dw-prog', JSON.stringify({ s:PROG.streak, m:PROG.mastered, q:PROG.queue }));
}
function loadProg(){

/* =====================================================================
   תאוריה מדברת · בנק הטעויות
   כל שאלה שטעית בה נשמרת לפי המזהה היציב שלה — כמה פעמים, ומתי לאחרונה.
   הבנק לא מתרוקן ברגע שתיקנת: לתקן שאלה שהתשובה שלה מולך על המסך זה לא
   לדעת אותה. החזרה האמיתית קורית מאוחר יותר, וזה בדיוק מה שהבנק שומר.
   כי המפתח הוא מזהה השאלה, הגודל חסום במספר השאלות במאגר. אין מה לגזום.
   ===================================================================== */
const MISTAKES = { items:{} };   /* id → { n:מספר טעויות, d:תאריך אחרון, cat:קטגוריה } */

/* אורך מפגש חזרה — כמו בתרגול. מי שצבר מאה טעויות לא צריך לראות מאה
   שאלות ברצף; הוא צריך חמש עשרה, ולחזור מחר. */
const MISTAKE_LEN = 15;

function recordMistake(id, cat){
  if(!id) return;            /* שאלה בלי מזהה — לא ממציאים לה אחד */
  const m = MISTAKES.items[id] || (MISTAKES.items[id] = { n:0, d:'', cat:'' });
  m.n++;
  m.d = dayKey();
  if(cat) m.cat = cat;
  saveMistakes();
}

/* מסננים מזהים שלא במאגר בזמן קריאה ולא מוחקים אותם בטעינה: כשרץ רק
   המאגר המובנה, המאגר המלא עדיין בדרך — ומחיקה עכשיו מאבדת טעויות אמיתיות.
   אותו שיקול בדיוק כמו התור השמור ב-buildQueue. */
function mistakeIds(){
  const valid = new Set(BANK.items.map(x => x.id));
  return Object.keys(MISTAKES.items)
    .filter(id => valid.has(id))
    .sort((a, b) => {
      const A = MISTAKES.items[a], B = MISTAKES.items[b];
      return (B.d || '').localeCompare(A.d || '') || B.n - A.n;   /* אחרון ראשון */
    });
}
function mistakeCount(){ return mistakeIds().length; }

function saveMistakes(){
  Store.set('dw-mistakes', JSON.stringify({ v:1, m:MISTAKES.items }));
}
function loadMistakes(){
  try{
    const o = JSON.parse(Store.get('dw-mistakes') || '{}');
    if(!o || typeof o.m !== 'object' || !o.m) return;
    const out = {};
    Object.keys(o.m).forEach(id => {
      const x = o.m[id];
      if(!x || typeof x !== 'object') return;
      const n = Math.floor(Number(x.n));
      if(!Number.isFinite(n) || n <= 0) return;      /* רשומה פגומה — מדלגים עליה בלבד */
      out[id] = { n:n,
                  d:typeof x.d === 'string' ? x.d : '',
                  cat:typeof x.cat === 'string' ? x.cat : '' };
    });
    MISTAKES.items = out;
  }catch(e){ /* בנק פגום — מתחילים נקי */ }
}

/* =====================================================================
   תאוריה מדברת · מצב האפליקציה
   ===================================================================== */
/* מהירות הקראה — בקרה אחת ויחידה, מוכפלת רק בכיול השפה.

const TTS_RATES = [0.7, 1, 1.3];
const TTS_RATE_ICON  = { 0.7:'🐢', 1:'▶', 1.3:'⚡' };
const TTS_RATE_LABEL = { 0.7:'spSlow', 1:'spNormal', 1.3:'spFast' };

/* audioVoice כאן הוא ברירת המחדל בפועל למי שטרם בחר — סדר
   AUDIO_VOICES קובע רק את הנפילה לאחור כשהקול השמור חסר קבצים. */
const S = { lang:'he', ttsRate:1, examRun:false, size:29, screen:'home', audioVoice:'gemini',
            /* '' = כל הנושאים. אחרת שם קטגוריה מהמאגר. */

const t = k => UI[S.lang][k];

/* ---------------- מדידה אנונימית ----------------
   נשלח לגיליון Google פרטי: מתי נפתח, כמה זמן, כמה שאלות נענו, סוג מכשיר.
   אין שם, אין אימייל, אין עוגיות. המזהה הוא מספר אקראי שנוצר במכשיר עצמו
   ומשמש רק כדי להבדיל בין עשר פתיחות של אדם אחד לעשרה אנשים.
   כתובת ריקה = המדידה כבויה לגמרי, והאפליקציה עובדת בדיוק אותו דבר. */
const METRICS_URL = 'https://script.google.com/macros/s/AKfycbzsZTkVx_VWy_9NZ33YwLk5UVB2NV8e1RdFWtdBnTvdCCYoaC4Jpg7FGw5x4Zm_w3DvvQ/exec';

const Metrics = (()=>{
  const off = { open(){}, answered(){} };
  if(!/^https:\/\//.test(METRICS_URL)) return off;

  let aid = Store.get('dw-aid');
  if(!aid){
    aid = Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
    Store.set('dw-aid', aid);
  }
  const ua = navigator.userAgent;
  const device = /Android/i.test(ua) ? 'Android'
               : /iPhone|iPad|iPod/i.test(ua) ? 'iOS'
               : /Windows|Macintosh|Linux/i.test(ua) ? 'Desktop' : 'Other';

  let t0 = Date.now(), answered = 0;

  function post(ev, extra){
    let installed = 'browser';
    try{ if(matchMedia('(display-mode: standalone)').matches) installed = 'app'; }catch(e){}
    const body = JSON.stringify(Object.assign(
      { ev, aid, device, installed, lang:S.lang, build:BUILD }, extra || {}));
    try{
      const blob = new Blob([body], { type:'text/plain;charset=UTF-8' });
      if(navigator.sendBeacon && navigator.sendBeacon(METRICS_URL, blob)) return;
    }catch(e){}
    /* sendBeacon לא זמין או נכשל — ניסיון אחרון, ובלי להפיל כלום */
    try{ fetch(METRICS_URL, { method:'POST', body, mode:'no-cors', keepalive:true }); }catch(e){}
  }

  /* מפגש נסגר כשעוברים לאפליקציה אחרת או סוגרים. חוזרים — מפגש חדש.
     קפיצה של פחות משלוש שניות בלי תשובות היא רעש, לא מפגש. */
  function flush(){
    const secs = Math.round((Date.now() - t0) / 1000);
    if(secs < 3 && !answered) return;
    post('close', { secs, answered });
    t0 = Date.now(); answered = 0;
  }
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'hidden') flush();
    else t0 = Date.now();
  });
  window.addEventListener('pagehide', flush);

  return {
    open(){ post('open'); },
    answered(){ answered++; }
  };
})();

function load(){

/* =====================================================================
   תאוריה מדברת · שכבת PWA — הכול בתוך הקובץ הזה
   Manifest ואייקונים נבנים כ-Data URLs. ה-Service Worker נבנה כ-Blob.
   ===================================================================== */
const PWA = { prompt:null, canInstall:false, installed:false, offline:false };

/* ---- אייקון האפליקציה כ-SVG (אין קובץ חיצוני) ---- */
function appIcon(pad){
  const p = pad ? 22 : 8, s = 512, c = s/2, r = (s/2) - (p*s/100);
  const pts = Array.from({length:8},(_,i)=>{
    const a = Math.PI/8 + i*Math.PI/4;
    return `${(c + r*Math.cos(a)).toFixed(1)},${(c + r*Math.sin(a)).toFixed(1)}`;
  }).join(' ');
  /* התמרור מדבר: נקודה ושלושה פסי קול לבנים בתוך המתומן.
     אותה צורה בדיוק כמו img/icon-c-512.png, כדי שהאייקון בחנות,
     במסך הבית ובלשונית הדפדפן יהיו זהים. */
  const bar = (dx, hf) => {
    const w = r*0.135, h = r*hf;
    return `<rect x="${(c + r*dx - w/2).toFixed(1)}" y="${(c - h/2).toFixed(1)}"`
      + ` width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="${(w/2).toFixed(1)}" fill="#FFFFFF"/>`;
  };
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${s} ${s}">`
    + `<rect width="${s}" height="${s}" fill="#0E1F33"/>`
    + `<polygon points="${pts}" fill="#C1272D"/>`
    + `<circle cx="${(c - r*0.50).toFixed(1)}" cy="${c}" r="${(r*0.055).toFixed(1)}" fill="#FFFFFF"/>`
    + bar(-0.30, 0.30) + bar(0.00, 0.62) + bar(0.28, 0.42)
    + `</svg>`;
}
const dataURL = svg => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
/* גרסת ה-maskable עברה ל-img/icon-c-512-maskable.png, שאליו מצביע ה-manifest */
const ICON = dataURL(appIcon(false));

/* ---- אייקוני הדפדפן ----
   ה-manifest עצמו עבר לקובץ manifest.json, כי Bubblewrap חייב כתובת שאפשר
   למשוך ו-Data URL אינו כזה. כאן נשארה רק הצבת האייקונים החיים: SVG נשאר
   עדיף לטאב ולמסך הבית באייפון, כי הוא חד בכל גודל ולא עולה בקשת רשת. */
function installIcons(){
  document.getElementById('fav').href = ICON;
  document.getElementById('ati').href = ICON;
}
installIcons();

/* ---- Service Worker מוטמע ---- */

/* ה-service worker יושב ב-sw.js לצד הקובץ. הגרסה עוברת אליו ב-?v=,
   כך ש-BUILD הוא מקור האמת היחיד: שינוי שלו משנה את כתובת הסקריפט,
   הדפדפן מתקין worker חדש ומוחק את המטמון הישן.
   בעבר נרשם כאן worker מ-blob:, שהדפדפנים חוסמים — ולכן לא היה
   service worker כלל והאפליקציה לא עבדה אופליין. */
function registerSW(){
  if(!('serviceWorker' in navigator)) return;
  if(!location.protocol.startsWith('http')) return;   /* file:// לא נתמך */
  navigator.serviceWorker.register('sw.js?v=' + BUILD)
    .then(reg => { if(DEV) console.log('[sw] נרשם, scope:', reg.scope); })
    .catch(e => { if(DEV) console.warn('[sw] הרישום נכשל — ממשיכים בלי', e); });
}
if(document.readyState === 'complete') registerSW();
else window.addEventListener('load', registerSW);

/* ---- מצב התקנה ---- */
function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true;
}
PWA.installed = isStandalone();
PWA.offline = !navigator.onLine;

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  PWA.prompt = e; PWA.canInstall = true;
  if(S.screen === 'home') render();
});
window.addEventListener('appinstalled', () => {
  PWA.prompt = null; PWA.canInstall = false; PWA.installed = true;
  if(S.screen === 'home') render();
});
window.addEventListener('online',  () => { PWA.offline = false; if(S.screen === 'home') render(); });
window.addEventListener('offline', () => { PWA.offline = true;  if(S.screen === 'home') render(); });

async function doInstall(){
  if(!PWA.prompt) return;
  PWA.prompt.prompt();
  const res = await PWA.prompt.userChoice;
  PWA.prompt = null;
  if(res.outcome !== 'accepted') PWA.canInstall = false;  /* סירוב אינו כישלון */
  if(S.screen === 'home') render();
}

/* =====================================================================
   תאוריה מדברת · ספק קול סטטי — קבצי MP3 מוקלטים מראש
   עלות שוטפת: אפס. עובד לא מקוון. אין מפתח ואין סיכון אבטחה.
   מבנה הקבצים:  audio/<שפה>/<מזהה>.mp3     לדוגמה  audio/he/l1-s0.mp3
   ===================================================================== */
/* הקולות המוקלטים שקיימים בתיקיית audio. ה-id הוא גם שם התיקייה.
   להוספת קול: מייצרים אותו עם tools/tts-build.js לתוך
   audio/<שפה>/<id>/ ומוסיפים כאן שורה.
   התוויות מציינות מגדר ולא שם — "Aoede" לא אומר כלום למי שלומד
   תאוריה, ובחירת קול נשמעת מיד אחרי הלחיצה ממילא. */
/* קול אחד, ובמכוון.

   ארבעת קולות Chirp3 הוסרו מכאן אחרי שנשמעו זה מול זה. הם לא סתם
   פחות טובים — הם ממציאים הברות. "מפגש" נשלח אליהם כ-מִפְגַּשׁ,
   מ־פ־ג־ש בלי ה' בשום מקום, ויוצא "מפגשה". 95 מחרוזות במאגר.
   מנוע שממפה אותיות לצליל נשבר על ניקוד במקום להיעזר בו.

   ג'מיני מבין את המשפט לפני שהוא אומר אותו, ולכן "זכות קדימה" מול
   "סע קדימה" ו"נהג" כשם עצם מול פועל יוצאים נכון — שתי המילים
   שאחרי 107 חוקי הגייה עדיין לא הוכרעו.

   ההקלטות של הארבעה נשארות ב-audio/he ובהיסטוריית גיט. להחזיר אחד
   מהם זו שורה כאן, בלי להקליט דבר. מי שבחר קול שהוסר יועבר לג'מיני
   מעצמו: הטעינה בודקת שהקול השמור קיים ברשימה לפני שהיא משחזרת אותו.

   בורר הקולות מסתתר לבד כשיש קול אחד, ולכן התווית כאן אינה מוצגת
   כרגע. אם יתווסף קול שני — יש להחזיר תווית מגדר, כי "ג׳מיני" לא
   אומר דבר למי שלומד לתאוריה. */
const AUDIO_VOICES = [
  { id:'gemini',   he:'ג׳מיני',  ar:'جيميني',  en:'Gemini',  ru:'Gemini' }
];
function audioVoiceLabel(v){ return v[S.lang] || v.en || v.id; }

const STATIC = {
  on:false,                /* probeStatic מדליק רק אם באמת יש קבצים */
  base:'audio',
  map:new Map(),           /* טקסט → מזהה קובץ, נבנה פעם אחת בהפעלה */
  missing:new Set(),       /* קבצים שלא נמצאו — לא מנסים אותם שוב */
  have:new Set()           /* אילו קולות באמת קיימים על השרת */
};

/* מזהה הקובץ נגזר מהתוכן, לא מהמיקום במאגר. שתי תוצאות:
   טקסט זהה בשתי שאלות מקבל קובץ אחד במקום שניים, ועריכת ניסוח יוצרת
   מזהה חדש — כך לעולם לא מנוגן קובץ ישן על טקסט שהשתנה, וזו בדיוק
   התקלה השקטה שאי אפשר לשים לב אליה.
   חייב להיות זהה ל-audioId שב-tools/tts-build.js, אחרת הקבצים
   שייוצרו לא יימצאו. */
function audioId(text){
  const s = String(text).trim().replace(/\s+/g, ' ');
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for(let i = 0; i < s.length; i++){
    const c = s.charCodeAt(i);
    h1 = Math.imul(h1 ^ c, 2654435761);
    h2 = Math.imul(h2 ^ c, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}

/* בונה את טבלת המזהים מכל התוכן: תרגול, מחרוזות ממשק, ומאגר השאלות
   המלא. הטבלה היא גם הרשימה של מה שיוצר בפועל — staticUrl לא מנסה
   למשוך קובץ שאינו בה. */
function buildAudioMap(){
  STATIC.map.clear();
  const put = (lang, txt) => {
    if(typeof txt !== 'string' || !txt.trim()) return;
    STATIC.map.set(lang + '|' + txt, audioId(txt));
  };

  Object.keys(LANGS).forEach(lang => {
    PRACTICE.forEach(P0 => {
      const d = P0.text[lang]; if(!d) return;
      put(lang, d.q);
      (d.o || []).forEach(x => put(lang, x));
      put(lang, d.h1);
      put(lang, d.h2);
      put(lang, d.p);
    });
    /* מחרוזות ממשק שנאמרות בקול */
    ['almostSay','correctIs','resT','resP'].forEach(k => put(lang, UI[lang][k]));
    /* משפטי העידוד נאמרים בקול אחרי כל תשובה נכונה. בלעדיהם כאן
       השאלה נשמעת בקול המוקלט והשבח מיד אחריה בקול המכשיר —
       מעבר חד באמצע אותו רגע. */
    ['cheers','cheerStreak'].forEach(k => (UI[lang][k] || []).forEach(x => put(lang, x)));
    ['milestone10','milestone25','milestone50','milestone100']
      .forEach(k => put(lang, UI[lang][k]));
    /* מחרוזות שנבנות ממספר. גם הן נאמרות בקול, ולכן צריכות קובץ
       משלהן — אחרת יישמע מעבר מקול מוקלט לקול המכשיר באמצע שאלה. */
    for(let n = 1; n <= 6; n++){
      put(lang, UI[lang].ansN(n));
      put(lang, UI[lang].correctIsN(n));
    }
  });

  /* מאגר השאלות המלא — 1,273 שאלות. נטען אסינכרונית ורק בשפה
     הנוכחית, ולכן buildAudioMap נקרא שוב אחרי loadBank ובכל
     החלפת שפה. הרמזים כבר מוזגו לתוך הפריטים ב-loadBank. */
  BANK.items.forEach(q => {
    put(S.lang, q.q);
    (q.o || []).forEach(x => put(S.lang, x));
    put(S.lang, q.h1);
    put(S.lang, q.h2);
    put(S.lang, q.p);
  });
}

/* בודקים אילו קולות באמת קיימים, לא רק הנבחר. בלי זה, ייצור חלקי —
   שנעצר באמצע, או שנוסף לו קול חדש ברשימה לפני שהוקלט — מציג למשתמש
   כפתור של קול שאין לו קבצים, והלחיצה עליו פשוט מחזירה אותו בשקט
   לקול המכשיר. ארבע בקשות HEAD זעירות בטעינה, והן נשמרות במטמון. */
async function probeStatic(){
  STATIC.missing.clear();          /* אולי התחלפה שפה או קול */
  STATIC.have.clear();
  const q = BANK.items[0];
  const id = q && STATIC.map.get(S.lang + '|' + q.q);
  if(!id){ STATIC.on = false; return; }

  await Promise.all(AUDIO_VOICES.map(async v => {
    try{
      const r = await fetch(`${STATIC.base}/${S.lang}/${v.id}/${id}.mp3`, { method:'HEAD' });
      if(r.ok) STATIC.have.add(v.id);
    }catch(e){ /* אין — פשוט לא נכנס לרשימה */ }
  }));

  /* הקול השמור נעלם? עוברים לראשון שכן קיים — אבל *לא* שומרים את
     המעבר. הבחירה של המשתמש נשארת רשומה, וברגע שהקול שבחר ייווצר
     הוא יחזור אליו מעצמו. */
  if(!STATIC.have.has(S.audioVoice)){
    const first = AUDIO_VOICES.find(v => STATIC.have.has(v.id));
    if(first) S.audioVoice = first.id;
  }
  STATIC.on = STATIC.have.has(S.audioVoice);

  if(DEV) console.log('[tts] קולות מוקלטים זמינים:',
                      STATIC.have.size ? [...STATIC.have].join(', ') : 'אין',
                      '· בשימוש:', STATIC.on ? S.audioVoice : 'קול המכשיר');

  /* הבדיקה אסינכרונית ומסתיימת אחרי הרינדור הראשון, ולכן צ׳יפי בחירת
     הקול לא הופיעו עד שהמשתמש ניווט וחזר. מרעננים את דף הבית ברגע
     שהתשובות הגיעו. render לא קורא ל-probeStatic, אין כאן לולאה. */
  if(S.screen === 'home'){ try{ render(); }catch(e){} }
}

/* הנתיב כולל את הקול הנבחר, ולכן החלפת קול מפנה לתיקייה אחרת לגמרי
   בלי לגעת במפה — המפה היא טקסט←מזהה ואינה תלויה בקול. */
function staticUrl(text, lang){
  const id = STATIC.map.get(lang + '|' + text);
  if(!id) return null;
  const url = `${STATIC.base}/${lang}/${S.audioVoice}/${id}.mp3`;
  return STATIC.missing.has(url) ? null : url;
}

/* מנסה למשוך קובץ מוקלט. מחזיר Blob, או null אם אין קובץ כזה. */
async function fetchStatic(text, lang){
  const url = staticUrl(text, lang);
  if(!url) return null;
  try{
    const r = await fetch(url);
    if(!r.ok){ STATIC.missing.add(url); return null; }
    const b = await r.blob();
    if(!b || b.size < 512){ STATIC.missing.add(url); return null; }  /* קובץ ריק או דף שגיאה */
    return b;
  }catch(e){
    STATIC.missing.add(url);
    return null;
  }
}

/* מוריד רשימת קבצים להקלטה — מה צריך להכין ומה השם של כל קובץ */
function exportAudioList(){
  const rows = [['file','lang','id','text']];
  STATIC.map.forEach((id, k) => {
    const [lang, ...rest] = k.split('|');
    rows.push([`${STATIC.base}/${lang}/${id}.mp3`, lang, id, rest.join('|')]);
  });
  const csv = '\uFEFF' + rows.map(r =>
    r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const url = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  const a = document.createElement('a');
  a.href = url; a.download = 'theory-audio-list.csv';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* =====================================================================
   תאוריה מדברת · ניגון האודיו המוקלט

   כאן ישבה פעם שכבה שנייה: קריאה חיה לספק TTS מתוך האפליקציה, עם
   ElevenLabs, Google Cloud ופרוקסי. היא נמחקה, ולא בגלל איכות.

   היא דרשה מפתח API שיושב בדף. הדף הזה סטטי וציבורי, וכל מי שפותח
   את המקור רואה את המפתח — כלומר השכבה הזאת סתרה חזיתית את הכלל
   שאין מפתחות ב-repo. היא גם הייתה משלמת על כל משפט של כל משתמש,
   במקום פעם אחת בייצור, ולא הייתה עובדת אופליין.

   בפועל היא מעולם לא רצה: ברירת המחדל הייתה 'local', ו-externalReady
   חסם אותה לפני כל ניסיון. משתמש היה צריך לגלות ?dev=1, להיכנס למסך
   מפתח ולהדביק מפתח משלו.

   נשארו שתי שכבות: קובץ מוקלט, ואם אין — קול המכשיר.
   ===================================================================== */
const TTS = {
  audio:null,          /* אלמנט השמע הנוכחי, כדי שאפשר יהיה לעצור אותו */
  /* אלמנט אחד, קבוע, שמשוחרר במגע הראשון ואז משמש לכל ההשמעות.
     ב-iOS ההיתר ניתן לאלמנט ולא לדף: אלמנט שקיבל play() בתוך מגע
     אמיתי ימשיך לנגן גם כשמחליפים לו src מקוד אסינכרוני. אלמנט
     חדש שנוצר אחרי fetch לא יקבל היתר לעולם. */
  el:null
};

/* ============================================================
   TTS_UNLOCK — שחרור הקול במגע הראשון
   ------------------------------------------------------------
   בלי זה אין קול בנייד בכלל, ובשקט: ב-iOS ההיתר להשמיע תלוי
   באישור משתמש שתקף רק בתוך ה-handler של המגע. שני מסלולי
   ההקראה כאן מאבדים אותו —

     · הקובץ המוקלט מושמע אחרי fetch, כלומר אחרי await;
     · קול המכשיר מושמע אחרי voicesReady(), גם הוא אחרי await.

   שניהם נדחים בלי חריגה ובלי לוג, ולכן זה נראה כאילו האפליקציה
   פשוט שותקת. משחררים פעם אחת, מיד, בתוך המגע עצמו.
   ============================================================ */
const SILENT_WAV = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
document.addEventListener('pointerdown', function ttsUnlock(){
  try{
    if(!TTS.el) TTS.el = new Audio();
    TTS.el.src = SILENT_WAV;
    const pr = TTS.el.play();
    if(pr && pr.then) pr.then(() => { try{ TTS.el.pause(); TTS.el.currentTime = 0; }catch(e){} })
                        .catch(() => {});
  }catch(e){}
  try{ window.speechSynthesis.speak(new SpeechSynthesisUtterance('')); }catch(e){}
}, { once:true });

/* =====================================================================
   תאוריה מדברת · מנוע הקראה
   הפרדה בין הטקסט המוצג (מנוקד) לטקסט הנשלח ל-TTS (כתיב מלא, בלי ניקוד).
   ===================================================================== */
const synth = window.speechSynthesis;
let voice = null, manualStop = false;
let speakGen = 0;
let speakTimer = null;

/* שומרים הפניה חיה ל-utterance. ב-Chrome אוסף הזבל בולע אובייקט שאין
   אליו הפניה, ואיתו נעלמים onend ו-onboundary — וההקראה "נתקעת" באמצע. */
let activeUtterance = null;

/* getVoices זורק בחלק מהדפדפנים כשהמנוע עוד לא עלה */
function safeVoices(){
  try{ return (synth && synth.getVoices()) || []; }
  catch(e){ return []; }
}

/* באג ותיק ב-Chrome/Edge בשולחן העבודה: ההקראה נחתכת אחרי ~15 שניות.
   pause+resume תקופתי מחזיק את המנוע ער. במובייל אין את הבאג ופעולה
   כזאת דווקא מקרטעת שם, ולכן מפעילים רק היכן שבאמת צריך. */
const NEEDS_KEEPALIVE = /Chrome|Chromium|Edg\//.test(navigator.userAgent)
                     && !/Android|Mobile/i.test(navigator.userAgent);
let keepAliveTimer = null;
function stopKeepAlive(){
  if(keepAliveTimer){ clearInterval(keepAliveTimer); keepAliveTimer = null; }
}
/* עוצרים רק כששום דבר כבר לא מדבר — אחרת משפט שהתחיל זה עתה יאבד
   את השמירה שלו כשהמשפט הקודם מסיים להתנקות */
function maybeStopKeepAlive(){
  try{ if(synth && (synth.speaking || synth.pending)) return; }catch(e){}
  stopKeepAlive();
}
function startKeepAlive(){
  if(!NEEDS_KEEPALIVE || !synth || keepAliveTimer) return;
  keepAliveTimer = setInterval(() => {
    try{
      if(!synth.speaking){ stopKeepAlive(); return; }
      if(synth.paused) return;               /* עצירה מכוונת — לא נוגעים */
      synth.pause(); synth.resume();
    }catch(e){ stopKeepAlive(); }
  }, 9000);
}

/* getVoices מחזיר רשימה ריקה עד שהמנוע נטען, ורק אז נורה voiceschanged.
   מי שמקריא לפני כן מקבל את קול ברירת המחדל של הדפדפן — לרוב אנגלי,
   גם כשמותקן קול עברי טוב. כאן ממתינים לאירוע, עם פולינג לדפדפנים
   שלא יורים אותו בכלל (Safari) ותקרת זמן כדי שלא ניתקע בהמתנה לנצח. */
let voicesLoaded = false;
let voicesPromise = null;
function voicesReady(){
  if(voicesPromise) return voicesPromise;
  voicesPromise = new Promise(resolve => {
    if(!synth){ voicesLoaded = true; resolve([]); return; }
    let poll = null, cap = null, done = false;
    const finish = () => {
      if(done) return;
      done = true; voicesLoaded = true;
      if(poll) clearInterval(poll);
      if(cap)  clearTimeout(cap);
      try{ synth.removeEventListener('voiceschanged', finish); }catch(e){}
      try{ voice = pickVoice(); }catch(e){ voice = null; }
      if(DEV) console.log('[tts] רשימת הקולות נטענה:', safeVoices().length,
                          '← נבחר:', voice ? voice.name + ' / ' + voice.lang : '(אין)');
      resolve(safeVoices());
    };
    if(safeVoices().length){ finish(); return; }
    try{ synth.addEventListener('voiceschanged', finish); }catch(e){}
    poll = setInterval(() => { if(safeVoices().length) finish(); }, 120);
    cap  = setTimeout(finish, 4000);         /* לא מחכים לנצח */
  });
  return voicesPromise;
}

/* יש מכשירי אנדרואיד שמדווחים lang ריק או שגוי, ואז הזיהוי לפי השפה
   נכשל והמשתמש נשאר בלי קול עברי אף שמותקן אחד. השם הוא הרמז האחרון,
   ולכן בודקים גם את שם השפה בשפה עצמה וגם את הכינוי הלועזי שלה. */
const LANG_HINT = {
  he:/עברית|hebrew|ivrit/i,
  ar:/العربية|arabic/i,
  en:/english/i,
  ru:/русский|russian/i
};

function voiceScore(x, code, base, hint){
  const lang = (x.lang || '').replace('_','-');
  let s = 0;
  if(lang === code) s += 10;                        /* he-IL מדויק */
  else if(lang.split('-')[0] === base) s += 8;      /* he כללי */
  else if(hint && hint.test(x.name || '')) s += 1;  /* רק השם רומז */
  else return -99;

  const n = x.name || '';
  if(/google/i.test(n)) s += 4;
  if(/microsoft/i.test(n)) s += 4;
  if(/natural|enhanced|premium|neural|wavenet/i.test(n)) s += 2;
  /* קול רשת נשמע טוב יותר — הקולות הנוירליים של Edge הם כאלה — אבל
     הוא שותק בלי אינטרנט. באפליקציה שמבטיחה עבודה אופליין זה קריטי:
     כשאין רשת, או אחרי שקול רשת כבר נכשל פעם אחת, מעדיפים מקומי. */
  if(x.localService === false) s += (NET_VOICE_OK && navigator.onLine !== false ? 2 : -8);
  if(/espeak|compact|pico/i.test(n)) s -= 6;
  if(PREFER_FEMALE){
    if(FEMALE_VOICE.test(n)) s += 2;
    else if(MALE_VOICE.test(n)) s -= 1;
  }
  return s;
}

function bestVoiceFor(lang, list){
  const cfg = LANGS[lang];
  if(!cfg) return null;
  const code = cfg.tts, base = code.split('-')[0];
  const hint = LANG_HINT[lang] || (cfg.name ? new RegExp(cfg.name,'i') : null);
  let best = null, bestScore = -1;
  for(const x of list){
    let s;
    try{ s = voiceScore(x, code, base, hint); }catch(e){ continue; }
    if(s > bestScore){ best = x; bestScore = s; }
  }
  return bestScore >= 0 ? best : null;
}

/* אין קול בשפת הממשק? לא לוקחים קול אנגלי. הכלל הקודם ביקש להימנע
   ממנוע רובוטי ישן, אבל מה שהוא נתן בפועל היה טקסט ערבי שנקרא בקול
   אנגלי — מילה במילה, בלתי מובן. null משאיר את u.lang בשפה הנכונה
   ואת הבחירה לדפדפן: קול ברירת מחדל בשפה הנכונה גרוע פחות מקול
   מצוין בשפה הלא נכונה. */
function pickVoice(){
  const v = safeVoices();
  if(!v.length) return null;
  return bestVoiceFor(speechLang(), v) || null;
}
/* האם המכשיר iOS? הוראות השדרוג שונות לגמרי */
const IS_WIN = /Windows/.test(navigator.userAgent);
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
            || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

/* הטיפ מוצג עד שהמשתמש סוגר אותו, ואז לא חוזר — אבל הסגירה נשמרת לפי
   *המצב* שבו נסגר. מי שסגר טיפ בזמן שהקול היה תקין לא יראה אותו שוב,
   ואילו מי שעבר לשפה שאין לה קול במכשיר יקבל את ההוראות פעם אחת, כי
   בלעדיהן אין לו דרך לפתור את זה. '1' הוא הערך של הגרסאות הישנות. */
function tipKey(){ return voiceStatus() === 'fallback' ? 'bad:' + S.lang : 'ok'; }
function tipDismissed(){
  const v = Store.get('dw-vtip'), k = tipKey();
  return v === k || (v === '1' && k === 'ok');
}
function dismissTip(){ Store.set('dw-vtip', tipKey()); }

/* מוצג רק כשיש הקראה בכלל — אחרת אין מה לשדרג.
   ההוראות מקופלות: מי שהקול שלו תקין לא צריך לקרוא אותן. כשאין קול
   בשפה הנבחרת הן נפתחות מעצמן, יחד עם הסבר מה הבעיה. */
function voiceTipHTML(){
  if(!synth) return '';
  const st = voiceStatus();
  /* אין קול בשפה הנבחרת, או אין קולות בכלל — בשני המקרים ההוראות
     הן מה שהמשתמש צריך לראות. */
  const bad = st === 'fallback';

  /* נסגר, והקול תקין — משאירים את כפתור הבדיקה לבדו. קודם הכרטיס
     נעלם לגמרי, ואיתו הדרך היחידה לבדוק את הקול: מי שלחץ "הבנתי"
     פעם אחת לא יכול היה למצוא אותו שוב לעולם. */
  if(tipDismissed()){
    return `<div class="vtip vtipmini" id="vtip" role="note">
      <button type="button" class="vtiptest" id="btnTipTest">${t('testV')}</button>
      <p class="vtipstat" id="vtipstat" role="status" aria-live="polite"></p>
    </div>`;
  }

  return `<div class="vtip" id="vtip" tabindex="-1" role="note">
    <h3>${t('vTipT')}</h3>
    <button type="button" class="vtiptest" id="btnTipTest">${t('testV')}</button>
    <p class="vtipstat${bad ? ' bad' : ''}" id="vtipstat" role="status" aria-live="polite">${
      bad ? escapeHTML(t('vTipBad')) : ''}</p>
    <details id="vtipfix"${bad ? ' open' : ''}>
      <summary>${t('vTipHow')}</summary>
      <pre>${IS_IOS ? t('vTipIos') : IS_WIN ? t('vTipWin') : t('vTipAnd')}</pre>
    </details>
    <button type="button" id="btnTipOk">${t('vTipOk')}</button>
  </div>`;
}

/* בדיקת הקול מדף הבית. בודקת את קול המכשיר בלבד — הטיפ עוסק בו ולא
   בספק החיצוני — ומדווחת בשם הקול שבאמת דיבר, כדי שאפשר יהיה לדעת
   אם השדרוג במכשיר באמת נקלט. */
async function tipVoiceTest(){
  const out = el('vtipstat'), fix = el('vtipfix');
  if(!out) return;

  const show = (html, kind) => {
    out.innerHTML = html;
    out.classList.toggle('bad',  kind === 'bad');
    out.classList.toggle('good', kind === 'good');
    if(fix && kind === 'bad') fix.open = true;   /* יש בעיה — פותחים הוראות */
  };

  if(!synth){ show(escapeHTML(t('noTTS')), 'bad'); return; }
  show(escapeHTML(t('testing')), null);

  stopSpeech();
  manualStop = false;                 /* stopSpeech הדליק את הדגל — מכבים */
  speakGen++;

  try{ await voicesReady(); }catch(e){}
  try{ voice = pickVoice(); }catch(e){ voice = null; }

  /* אין רשימת קולות? לא מסיקים מזה שאין הקראה — פשוט מנסים לדבר.
     המכשיר ידבר בקול ברירת המחדל שלו, ורק כישלון אמיתי של ההקראה
     יעיד שאין הקראה בכלל. */
  if(!voice && !safeVoices().length){
    show(escapeHTML(t('vUnknown')), null);
    speakLocal(t('testOK'),
      () => show(escapeHTML(t('vUnknown')), 'good'),
      null,
      () => show(escapeHTML(t('noTTS')), 'bad'));
    return;
  }

  /* "בעיה" = אין קול בשפה שהמשתמש בחר, ולכן נופלים לשפה אחרת */
  const want = LANGS[speechLang()].tts.split('-')[0];
  const got  = voice ? (voice.lang || '').replace('_','-').split('-')[0] : '';
  const bad  = got !== want;

  const name = voice ? voice.name + ' (' + voice.lang + ')' : t('vLocal');
  show(escapeHTML(t('vInUse')) + ': <span dir="ltr">' + escapeHTML(name) + '</span><br>'
       + escapeHTML(bad ? t('vTipBad') : t('vTipGood')), bad ? 'bad' : 'good');

  speakLocal(t('testOK'), null, null, () => show(escapeHTML(t('testFail')), 'bad'));
}

function voiceStatus(){
  if(!('speechSynthesis' in window)) return 'none';
  try{ voice = pickVoice(); }catch(e){ voice = null; }
  if(!voice){
    /* רשימה ריקה אינה עדות לכך שאין הקראה. יש מכשירי אנדרואיד
       שמחזירים רשימה ריקה תמיד ובכל זאת מדברים מצוין בקול ברירת
       המחדל של המערכת. אי אפשר להסיק מכאן כלום, ולכן לא מרימים
       אזעקה — ההכרעה נשארת לבדיקה שבאמת מקריאה. */
    return safeVoices().length ? 'fallback' : 'ok';
  }
  const vb = (voice.lang || '').replace('_','-').split('-')[0];
  return vb === LANGS[speechLang()].tts.split('-')[0] ? 'ok' : 'fallback';
}
/* הרשימה משתנה גם אחרי הטעינה הראשונה — התקנת קול חדש או החלפת מנוע */
if(synth){
  try{
    synth.addEventListener('voiceschanged', () => {
      voicesLoaded = true;
      const before = voice;
      try{ voice = pickVoice(); }catch(e){}
      /* האבחנה בדף הבית נקבעת לפי הקול שנבחר. אם הוא השתנה אחרי
         הרינדור, מרעננים כדי שהטיפ ישקף את המצב האמיתי. */
      if(voice !== before && S.screen === 'home'){ try{ render(); }catch(e){} }
    });
  }catch(e){}
  voicesReady();                      /* מחממים את הרשימה כבר בטעינה */
}

/* כיול לפי שפה: rate = מכפיל בסיס, pitch = גובה קול.
   בעברית הקולות הנפוצים (Carmit ב-iOS, he-IL של Google) מדברים מהר יחסית,
   ולכן בסיס נמוך יותר. pitch נשאר 1.0 — כל סטייה ממנו פוגעת בבהירות. */
const VOICE_TUNE = { he:{base:0.82,pitch:1.0}, ar:{base:0.85,pitch:1.0},
                     en:{base:0.90,pitch:1.0}, ru:{base:0.88,pitch:1.0} };

/* =====================================================================
   תאוריה מדברת · מצב קריוקי — הדגשת המילה הנקראת
   הטקסט שנשלח למנוע אינו הטקסט שעל המסך: הניקוד יורד והכתיב המלא
   נכנס, ולכן charIndex של boundary מצביע על מחרוזת אחרת לגמרי.
   speechMap בונה את שתי המחרוזות יחד ושומר לכל מילה גם את מיקומה
   בטקסט המוצג וגם את מיקומה בטקסט הנאמר.
   ===================================================================== */
const KARAOKE = {
  supported: typeof SpeechSynthesisUtterance !== 'undefined'
             && 'onboundary' in SpeechSynthesisUtterance.prototype,
  node:null, spans:[], cur:-1
};
/* חוקי ההגייה מיוצאים מ-tools על ידי export-speech-rules.js, כדי
   שלמערכת יהיה מקור אמת אחד. עד שהם נטענים — ואם הטעינה נכשלת —
   speechMap ממשיך לעבוד בדיוק כפי שעבד קודם. */
const SPEECH_RULES = { words:null, context:[], numbers:null, ktiv:null, ready:false };

async function loadSpeechRules(){
  try{
    /* בלי ?v= — ה-precache ב-sw.js מכניס את הכתובת החשופה, וה-cache-first
       שם משווה כתובת מלאה. עם query שתי הכתובות אינן אותה רשומה, הקובץ
       שיושב במטמון אינו נמצא, וההקראה אופליין חוזרת לבטא שגוי. דור
       המטמון ממילא מתחלף עם BUILD, ולכן ה-query היה מיותר. */
    const r = await fetch('data/speech-rules.json');
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    SPEECH_RULES.words   = j.words || {};
    SPEECH_RULES.numbers = j.numbers || null;
    /* מקור האמת ל-KTIV הוא הקובץ המיוצא, לא הטבלה שבקוד.
       הטבלה נשארת רק כגיבוי לשניות שלפני הטעינה. */
    if(j.ktiv) SPEECH_RULES.ktiv = j.ktiv;
    /* מהדרים את הביטויים פעם אחת ולא בכל מילה */
    SPEECH_RULES.context = (j.context || []).map(x => ({
      word: x.word,
      before: x.before ? new RegExp('^' + x.before + '$') : null,
      after:  x.after  ? new RegExp('^' + x.after  + '$') : null,
      voweled: x.voweled
    }));
    SPEECH_RULES.ready = true;
    if(DEV) console.log('[tts] חוקי הגייה נטענו:',
      Object.keys(SPEECH_RULES.words).length, 'מילים,',
      SPEECH_RULES.context.length, 'הקשר');
  }catch(e){
    if(DEV) console.warn('[tts] טעינת חוקי ההגייה נכשלה — ממשיכים עם KTIV בלבד', e);
  }
}

/* המקף הוא מפריד מילים לכל דבר: "דו-סטרי" הוא שתי מילים, וחוק
   ההגייה של "סטרי" חייב להגיע אליה. בלי המקף כאן האפליקציה ראתה
   אסימון אחד ולא ניקדה, בעוד שההקלטות — שבודקות גבול מילה מול תו
/* גבול מילה. מפצלים על כל רצף שאינו אות עברית ואינו ספרה,
   בדיוק כפי שהכלים בודקים גבול מול טווח התווים העבריים.

   רשימה מנויה של סימני פיסוק לא עבדה: מקף וגרשיים לא היו בה,
   ולכן "דו-סטרי" היה אסימון אחד שלא תאם לאף חוק — בעוד שבצד
   הבנייה אותה מילה כן זוהתה ונוקדה. שם נפרדו המסלולים.

   הספרות נשארות בתוך האסימון כי חוק מספרי התמרור צריך אותן
/* גבול מילה. מפצלים על כל רצף שאינו אות, ספרה או סימן משולב.

   הניסוח הזה מכסה שלושה דברים בבת אחת: מקף וגרשיים הם מפרידים,
   ולכן "דו-סטרי" הוא שתי מילים וחוק ההגייה מגיע אליה; ספרות
   נשארות שלמות כדי שחוק מספרי התמרור יעבוד; וניקוד הוא סימן
   משולב ולכן נשאר חלק מהמילה ולא שובר אותה.

   קודם היה כאן טווח עברי מפורש, וזה הפך כל אות לטינית או ערבית
   למפריד — ההדגשה מתה באנגלית, בערבית וברוסית. אות היא אות בכל
   כתב. */
const SEP_SPLIT = /([^\p{L}\p{N}\p{M}]+)/u;
const SEP_ONLY  = /^[^\p{L}\p{N}\p{M}]+$/u;
/* סוף משפט — עד כאן מותר לחוק הקשר להסתכל */
const STOP      = /[.!?;:\n]/;
/* שמות הספרות לשפות שאין להן קובץ חוקי הגייה. העברית מגיעה
   מ-speech-rules.json ונשארת שם — היא תוצר של עבודת ההגייה ולא
   רשימה שאפשר לכתוב מהראש. */
const DIGIT_WORDS = {
  ar: ['صفر','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة'],
  en: ['zero','one','two','three','four','five','six','seven','eight','nine'],
  ru: ['ноль','один','два','три','четыре','пять','шесть','семь','восемь','девять']
};

/* מספר תמרור נקרא ספרה-ספרה בכל שפה. "136" הוא שם של תמרור, לא
   כמות, ו"מאה שלושים ושש" מלמד מספר שאינו קיים.

   עד היום הכלל הזה רץ בעברית בלבד, ובשפות האחרות הספרות נשלחו
   גולמיות למנוע — שקרא אותן במודל המספרים שלו, לרוב האנגלי. קול
   ערבי שאומר "one three six" באמצע משפט ערבי הוא בדיוק התקלה
   שהכלל הזה נועד למנוע, רק בשפה אחרת. */
function spellDigits(bare, digits, letterClass){
  const letter = new RegExp('[' + (letterClass || 'א-ת') + ']');
  return bare.replace(/[0-9]+/g, (d, i, str) => {
    const before = i > 0 ? str[i - 1] : '';
    const after  = str[i + d.length] || '';
    return (letter.test(before) ? ' ' : '') +
           d.split('').map(c => digits[+c] || c).join(' ') +
           (letter.test(after) ? ' ' : '');
  });
}

const SPEECH_CACHE = new Map();

/* מחליט איך נאמרת מילה אחת, בהינתן שכנותיה.
   סדר השכבות זהה לזה שב-tools/speech.js: מספר, הקשר, מילה, ואז
   KTIV ככתיב מלא. הראשון שמכריע מנצח. */
function spokenToken(bare, prev, next, wholeIsCode){
  const R = SPEECH_RULES;

  /* ספרות שבתוך מזהה נקראות ספרה-ספרה — מספר תמרור "615", רשימה
     כמו "136, 135", או קוד עם אות כמו "ס-31". מספר בתוך משפט הוא
     כמות ונשאר כפי שהוא. זה בדיוק מה ש-spellCodeToken עושה בצד
     הבנייה, והיישור הזה הוא מה שמונע ששני המסלולים ייפרדו. */
  if(R.numbers && wholeIsCode && /[0-9]/.test(bare)){
    return spellDigits(bare, R.numbers.digits, R.numbers.letter);
  }

  for(const r of R.context){
    if(r.word !== bare) continue;
    if(r.after  && !(next && r.after.test(next)))  continue;
    if(r.before && !(prev && r.before.test(prev))) continue;
    return r.voweled;
  }

  if(R.words && R.words[bare]) return R.words[bare];
  const k = R.ktiv || KTIV;
  return k[bare] || bare;
}

/* חייב להחזיר בדיוק את מה ש-toSpeech מחזיר — אחרת ההדגשה תזוז */
function speechMap(display){
  const src = String(display == null ? '' : display);
  const hit = SPEECH_CACHE.get(S.lang + '|' + src);
  if(hit) return hit;

  /* האם המחרוזת כולה מזהה? נבדק פעם אחת, בדיוק כמו isCode
     ו-hasUnit בצד הבנייה. codes מגיע מ-speech-rules.json; אם נטען
     קובץ ישן שאין בו כאלה, נשארת ההתנהגות הקודמת — מספר בלבד. */
  const N = SPEECH_RULES.numbers;
  const trimmed = src.trim();
  const codes = N && (N.codes || ['[0-9]{' + N.minDigits + ',}']);
  const wholeCode = !!(N &&
    new RegExp('^(?:' + codes.join('|') + ')$').test(trimmed) &&
    !N.units.some(u => src.indexOf(u) !== -1));

  const toks = src.split(SEP_SPLIT);
  /* רק אסימוני מילים, לצורך "השכן הקודם" ו"השכן הבא" */
  const bare = toks.map(tk => (tk && !SEP_ONLY.test(tk))
    ? tk.replace(/[֑-ׇ]/g, '') : null);

  const words = [];
  const changed = [];
  let spoken = '', dpos = 0;

  for(let i = 0; i < toks.length; i++){
    const tk = toks[i];
    if(!tk) continue;
    const dStart = dpos;
    dpos += tk.length;
    if(SEP_ONLY.test(tk)){ spoken += tk; continue; }

    let spk = tk;
    const dw = DIGIT_WORDS[speechLang()];
    if(dw && wholeCode && /[0-9]/.test(bare[i])){
      /* מחלקת האותיות היא של השפה עצמה — מספר תמרור כמו 127פ שמר
         את האות העברית שלו גם בתרגום, ולכן היא נשארת בתבנית. */
      spk = spellDigits(bare[i], dw, 'א-ת');
    }
    else if(speechLang() === 'he'){
      /* השכן נמצא מעבר לפסיק, לסוגר ולמקף — אבל לא מעבר לסוף
         משפט. בלי החסימה "נוגעים לרכב. השאלה" היה מנקד את "לרכב"
         לפי מילה מהמשפט הבא, שכנות שקיימת בקוד ולא בשפה. אותה
         חסימה בדיוק נמצאת ב-GAP שבצד הבנייה. */
      let prev = null, next = null;
      for(let k = i - 1; k >= 0; k--){
        if(bare[k]){ prev = bare[k]; break; }
        if(STOP.test(toks[k])) break;
      }
      for(let k = i + 1; k < toks.length; k++){
        if(bare[k]){ next = bare[k]; break; }
        if(STOP.test(toks[k])) break;
      }
      spk = spokenToken(bare[i], prev, next, wholeCode);
      if(DEV && spk !== bare[i]) changed.push(bare[i] + '→' + spk);
    }

    words.push({ dStart, dEnd:dpos, sStart:spoken.length, sEnd:spoken.length + spk.length });
    spoken += spk;
  }

  const out = { spoken, words };
  if(DEV && changed.length){
    console.log('[tts] מוצג : ' + src.slice(0, 70));
    console.log('[tts] נאמר : ' + spoken.slice(0, 78));
    console.log('[tts] הוחלף: ' + changed.join('  ·  ') + '   (' + words.length + ' מילים)');
  }

  /* אותה שאלה מוקראת שוב ושוב — "שוב", מעבר בין רמזים, חזרה
     אחורה. אין טעם לחשב את אותו מיפוי בכל פעם. */
  if(SPEECH_CACHE.size > 400) SPEECH_CACHE.clear();
  SPEECH_CACHE.set(S.lang + '|' + src, out);
  return out;
}

/* עוטף כל מילה ב-span. הריפוד מקוזז במרג' שלילי, כך שהרוחב לא זז. */
function paintWords(node, display, map){
  if(!node) return [];
  const out = [];
  let pos = 0;
  map.words.forEach((w, i) => {
    out.push(escapeHTML(display.slice(pos, w.dStart)));
    out.push('<span class="kw" data-k="' + i + '">' + escapeHTML(display.slice(w.dStart, w.dEnd)) + '</span>');
    pos = w.dEnd;
  });
  out.push(escapeHTML(display.slice(pos)));
  node.innerHTML = out.join('');
  return [...node.querySelectorAll('.kw')];
}

function clearKaraoke(){
  if(KARAOKE.node) KARAOKE.node.classList.remove('kwhole');
  if(KARAOKE.spans[KARAOKE.cur]) KARAOKE.spans[KARAOKE.cur].classList.remove('on');
  KARAOKE.spans = []; KARAOKE.node = null; KARAOKE.cur = -1;
}
function highlightWord(i){
  if(i === KARAOKE.cur) return;
  if(KARAOKE.spans[KARAOKE.cur]) KARAOKE.spans[KARAOKE.cur].classList.remove('on');
  if(KARAOKE.spans[i]) KARAOKE.spans[i].classList.add('on');
  KARAOKE.cur = i;
}
/* גיבוי: אין boundary, או שמנגנים קובץ שמע — מדגישים את המשפט כולו */
function highlightWhole(node){
  if(node) node.classList.add('kwhole');
}

/* קול המכשיר — הגיבוי שתמיד עובד.
   ממתין לטעינת רשימת הקולות לפני ההקראה, כדי שלא ידבר בקול ברירת
   המחדל רק מפני שהרשימה טרם הגיעה. */
function speakLocal(text, onDone, node, onError){
  if(!synth){ if(onDone) onDone(); return; }
  voicesReady()
    .then(() => speakLocalNow(text, onDone, node, onError))
    .catch(e => {
      if(DEV) console.warn('[tts] המתנה לקולות נכשלה', e);
      if(onError) onError(); else if(!manualStop && onDone) onDone();
    });
}

/* אורך מקסימלי למקטע. מעליו מנועי מכשיר נוטים להאיץ ולבלוע
   סופי מילים. 90 תווים הם בערך שני משפטים קצרים בעברית. */
const SEG_MAX = 90;
const SEG_GAP = 260;      /* הפסקה בין מקטעים, במילישניות */

/* מחזיר מקטעים עם ההיסט של כל אחד בתוך המחרוזת המלאה. ההיסט
   הוא מה שמאפשר להדגשה להמשיך לעבוד — charIndex מתאפס בכל
   אמירה, ובלעדיו ההדגשה הייתה קופצת לתחילת המשפט בכל מקטע. */
/* סימן פיסוק שיושב בין שתי ספרות הוא חלק מהמספר — מפריד אלפים
   או נקודה עשרונית — ולא מקום לחתוך בו. בלי הבדיקה הזאת "3,500"
   נשבר לשניים והמנוע קורא "שלוש, חמש מאות". */
function insideNumber(str, i){
  return i > 0 && i + 1 < str.length &&
         /[0-9]/.test(str[i - 1]) && /[0-9]/.test(str[i + 1]);
}

function segments(spoken){
  const out = [];
  const push = (t, start) => { if(t.trim()) out.push({ text:t, start }); };

  /* שלב א: על סוף משפט. הסימן נשאר עם המקטע שלפניו. */
  const parts = [];
  let from = 0;
  for(let i = 0; i < spoken.length; i++){
    if('.!?:;'.indexOf(spoken[i]) === -1) continue;
    if(insideNumber(spoken, i)) continue;      /* 3.5 אינו סוף משפט */
    let j = i + 1;
    while(j < spoken.length && /\s/.test(spoken[j])) j++;
    parts.push({ text: spoken.slice(from, j), start: from });
    from = j;
    i = j - 1;
  }
  if(from < spoken.length) parts.push({ text: spoken.slice(from), start: from });

  /* שלב ב: מקטע שעדיין ארוך — על פסיק, ואם אין, על רווח.
     לעולם לא באמצע מילה. */
  for(const p of parts){
    if(p.text.length <= SEG_MAX){ push(p.text, p.start); continue; }
    let rest = p.text, base = p.start;
    while(rest.length > SEG_MAX){
      /* מדלגים אחורה על פסיקים שהם חלק ממספר */
      let cut = rest.lastIndexOf(',', SEG_MAX);
      while(cut > 0 && insideNumber(rest, cut)){
        cut = rest.lastIndexOf(',', cut - 1);
      }
      if(cut < SEG_MAX * 0.4) cut = rest.lastIndexOf(' ', SEG_MAX);
      if(cut <= 0){ break; }        /* מילה אחת ארוכה — משאירים שלמה */
      push(rest.slice(0, cut + 1), base);
      base += cut + 1;
      rest = rest.slice(cut + 1);
    }
    push(rest, base);
  }

  return out.length ? out : [{ text: spoken, start: 0 }];
}

function speakLocalNow(text, onDone, node, onError){
  let u = null, watchdog = null, finished = false, retried = false;

  const finish = (why, failed) => {
    if(finished) return;
    finished = true;
    if(watchdog){ clearInterval(watchdog); watchdog = null; }
    if(activeUtterance === u) activeUtterance = null;
    maybeStopKeepAlive();
    clearKaraoke();
    if(DEV) console.log('[tts] סיום הקראה:', why);
    if(failed && onError){ onError(); return; }
    if(!manualStop && onDone) onDone();
  };

  /* יש מכשירים שבהם onend פשוט לא נורה. בלי השומר הזה התור נתקע,
     S.playing נשאר דלוק וכפתור ההשמעה קופא. */
  const armWatchdog = () => {
    let idle = 0;
    watchdog = setInterval(() => {
      let busy = false;
      try{ busy = !!(synth.speaking || synth.pending); }catch(e){}
      if(busy){ idle = 0; return; }
      if(++idle >= 4) finish('שומר זמן — המנוע שתק בלי onend', false);
    }, 1000);
  };

  try{
    const tune = VOICE_TUNE[S.lang] || VOICE_TUNE.he;
    const map = speechMap(text);

    /* מקטעים במקום אמירה אחת ארוכה. seg הוא המקטע הנוכחי,
       ו-seg.start הוא ההיסט שלו במחרוזת המלאה. */
    const segs = segments(map.spoken);
    let si = 0;
    let seg = segs[0];

    u = new SpeechSynthesisUtterance(seg.text);
    /* כשנפלנו לקול בשפה אחרת, u.lang חייב להתאים לקול עצמו — אחרת
       חלק מהמנועים מתבלבלים ושותקים לגמרי */
    u.lang  = ((voice && voice.lang) || LANGS[speechLang()].tts).replace('_','-');
    u.rate  = +(tune.base * S.ttsRate).toFixed(2);
    /* אין קול נשי בשפה הזאת במכשיר? מרימים את הגובה. לא קול נשי
       אמיתי, אבל זו הדרך היחידה בדפדפן להתקרב בלי הקלטות. */
    const male = voice && MALE_VOICE.test(voice.name || '') && !FEMALE_VOICE.test(voice.name || '');
    u.pitch = male ? Math.min(2, tune.pitch * 1.35) : tune.pitch;
    if(voice) u.voice = voice;

    clearKaraoke();
    if(node){
      KARAOKE.node = node;
      if(KARAOKE.supported){
        KARAOKE.spans = paintWords(node, String(text), map);
        u.onboundary = ev => {
          try{
            if(ev.name && ev.name !== 'word') return;
            /* charIndex מתאפס בכל מקטע — מוסיפים את ההיסט
               כדי לקבל מיקום במחרוזת המלאה. */
            const ci = seg.start + ev.charIndex;
            let idx = -1;
            for(let i = 0; i < map.words.length; i++){
              if(map.words[i].sStart <= ci) idx = i; else break;
            }
            if(idx >= 0) highlightWord(idx);
          }catch(e){}
        };
      }else{
        highlightWhole(node);          /* אין תמיכה — מדגישים משפט שלם */
      }
    }

    /* סוף מקטע אינו סוף ההקראה. מקדמים, ורק אחרי האחרון
       מסיימים. ההפסקה ביניהם היא מה שמונע מהמנוע לרוץ קדימה
       ולבלוע סופי מילים. */
    u.onend = () => {
      if(finished || manualStop) return;
      if(si + 1 >= segs.length){ finish('onend', false); return; }
      si++;
      seg = segs[si];
      setTimeout(() => {
        if(finished || manualStop) return;
        try{
          const nu = new SpeechSynthesisUtterance(seg.text);
          nu.lang = u.lang; nu.rate = u.rate; nu.pitch = u.pitch;
          if(u.voice) nu.voice = u.voice;
          nu.onboundary = u.onboundary;
          nu.onend = u.onend;
          nu.onerror = u.onerror;
          u = nu;
          activeUtterance = u;
          synth.speak(u);
        }catch(e){ finish('מקטע נכשל: ' + e, true); }
      }, SEG_GAP);
    };
    u.onerror = ev => {
      const err = (ev && ev.error) || '';
      /* ביטול יזום אינו תקלה — stopSpeech או תור חדש כבר ניקו אחריו */
      const real = !(err === 'canceled' || err === 'interrupted');

      /* קול רשת שנכשל פירושו כמעט תמיד שאין אינטרנט. עוברים לקול
         מקומי וחוזרים על אותו משפט, פעם אחת, כדי שההקראה לא תישבר
         בשקט באמצע שאלה. סוגרים את הניסיון הזה בלי לקדם את התור. */
      if(real && !retried && voice && voice.localService === false){
        retried = true;
        NET_VOICE_OK = false;
        finished = true;
        if(watchdog){ clearInterval(watchdog); watchdog = null; }
        if(activeUtterance === u) activeUtterance = null;
        try{ voice = pickVoice(); }catch(e){}
        if(DEV) console.warn('[tts] קול רשת נכשל — עוברים לקול מקומי');
        speakLocalNow(text, onDone, node, onError);
        return;
      }

      finish('onerror: ' + (err || 'לא ידוע'), real);
    };

    if(DEV) console.log('[tts] tier 3 — קול המכשיר:',
                        voice ? voice.name + ' / ' + voice.lang : '(ברירת מחדל של הדפדפן)',
                        'rate', u.rate, 'pitch', u.pitch,
                        '· מקטעים:', segs.length);

    activeUtterance = u;                            /* מגן מפני איסוף זבל */
    try{ if(synth.paused) synth.resume(); }catch(e){}
    synth.speak(u);
    startKeepAlive();
    armWatchdog();
  }catch(e){
    if(DEV) console.warn('[tts] speakLocal נכשל', e);
    finish('חריגה: ' + e, true);
  }
}

/* סדר העדיפויות: קובץ מוקלט ← קול המכשיר.
   מחזיר Blob לניגון, או null אם צריך ליפול לקול המכשיר. */
async function resolveAudio(text, lang){
  if(STATIC.on){
    const b = await fetchStatic(text, lang);
    if(b){
      if(DEV) console.log('[tts] tier 1 — קובץ מוקלט:', staticUrl(text, lang));
      return b;
    }
  }
  if(DEV) console.log('[tts] נופלים לקול המכשיר (tier 2)');
  return null;
}

/* נקודת הכניסה היחידה להקראה בכל האפליקציה */
function speak(text, onDone, node){
  const done = () => { if(!manualStop && onDone) onDone(); };
  const fallback = () => speakLocal(text, onDone, node);

  resolveAudio(text, S.lang).then(blob => {
    if(manualStop) return;
    if(!blob){ fallback(); return; }

    const url = URL.createObjectURL(blob);
    /* משתמשים באלמנט ששוחרר במגע, ולא יוצרים חדש — אחרת ב-iOS
       ה-play() נדחה, וגם הנפילה לקול המכשיר נדחית, והתוצאה שקט. */
    if(!TTS.el) TTS.el = new Audio();
    const a = TTS.el;
    a.onended = null; a.onerror = null;
    a.src = url;
    a.playbackRate = S.ttsRate;
    TTS.audio = a;

    /* קובץ שמע לא מדווח על מילים — מדגישים את המשפט כולו */
    clearKaraoke();
    if(node){ KARAOKE.node = node; highlightWhole(node); }

    const cleanup = () => { URL.revokeObjectURL(url); if(TTS.audio === a) TTS.audio = null; };
    a.onended = () => { clearKaraoke(); cleanup(); done(); };
    a.onerror  = () => { clearKaraoke(); cleanup(); fallback(); };
    a.play().catch(() => { clearKaraoke(); cleanup(); fallback(); });
  }).catch(fallback);
}
/* הפסקה בין פריטי התור. בלי זה השאלה וארבע התשובות נשמעות כמשפט
   אחד רצוף, ומי שנעזר רק בהקראה לא יודע איפה נגמרת תשובה ומתחילה
   הבאה. משוב מבודקת, והיא צודקת. */
const SPEAK_GAP = 320;

function speakQueue(list, nodes){
  /* פריטים ריקים — רמז שלא קיים, למשל — תופסים מקום בתור, מוסיפים
     הפסקה מיותרת, ואף גורמים לניסיון למשוך קובץ שמע של מחרוזת ריקה.
     מסננים אותם יחד עם הצמתים, כדי שההצמדה לא תזוז. */
  const keep = [];
  (list || []).forEach((txt, i) => {
    if(typeof txt === 'string' && txt.trim()){
      keep.push([txt, (nodes && nodes[i]) || null]);
    }
  });
  list  = keep.map(x => x[0]);
  nodes = keep.map(x => x[1]);

  const gen = ++speakGen;
  manualStop = false;
  if(synth) synth.cancel();
  clearKaraoke();
  S.playing = true; syncPlayUI();
  let k = 0;
  const step = () => {
    if(manualStop || gen !== speakGen) return;
    if(k >= list.length){ S.playing = false; clearKaraoke(); syncPlayUI(); return; }
    const i = k++;
    speak(list[i], next, (nodes && nodes[i]) ? nodes[i] : null);
  };
  const next = () => {
    if(manualStop || gen !== speakGen) return;
    speakTimer = setTimeout(step, SPEAK_GAP);
  };
  speakTimer = setTimeout(step, 60);
}

/* מספר התשובה נאמר כפריט נפרד בתור, ולא כחלק מהטקסט שלה. שלוש
   סיבות: הטקסט המוקרא נשאר זהה לטקסט שבמאגר ולכן ממשיך להתאים
   לקובץ המוקלט, הדגשת המילים לא זזה, ובין המספר לתשובה נופלת
   הפסקה בלי שום עבודה נוספת. */
function labelledOpts(opts){
  const out = [];
  (opts || []).forEach((o, i) => out.push(t('ansN')(i + 1), o));
  return out;
}

/* בונה תור של שאלה + תשובות ממוספרות, עם צמתי ההדגשה במקומם.
   למספר עצמו אין צומת — אין מה להדגיש. */
function speakQuestion(qText, opts, extra){
  const kn = karaokeNodes();
  const list = [qText], nodes = [kn[0] || null];
  (opts || []).forEach((o, i) => {
    list.push(t('ansN')(i + 1)); nodes.push(null);
    list.push(o);                nodes.push(kn[i + 1] || null);
  });
  (extra || []).forEach(x => { list.push(x); nodes.push(null); });
  speakQueue(list, nodes);
}
function stopSpeech(){
  manualStop = true;
  speakGen++;                                    /* מבטל תורים תלויים */
  clearKaraoke();
  stopKeepAlive();
  activeUtterance = null;
  if(speakTimer){ clearTimeout(speakTimer); speakTimer = null; }
  /* מנוע שנשאר במצב paused מתעלם מ-cancel ואז שותק לשארית הסשן */
  try{ if(synth){ if(synth.paused) synth.resume(); synth.cancel(); } }catch(e){}
  if(TTS.audio){
    try{ TTS.audio.pause(); }catch(e){}
    TTS.audio = null;                            /* עוצר גם קול חיצוני */
  }
  S.playing = false;
  try{ syncPlayUI(); }catch(e){}
}

/* =====================================================================
   תאוריה מדברת · ניתוב מסכים
   ===================================================================== */
/* חייב להתאים למפת המסכים ב-render() — שם לא מוכר מפיל את האפליקציה */
const VALID_SCREENS = ['settings', 'home','voice','flow',
                       'practice','exam','challenge','mistakes','result','tracker'];

function go(name, arg){
  if(!VALID_SCREENS.includes(name)) name = 'home';
  stopSpeech();
  if(name === 'challenge'){
    if(!CHALLENGE.seed) CHALLENGE.seed = newSeed();
    CHALLENGE.active = true;
    S.examRun = false;
    S.deck = challengeDeck(CHALLENGE.seed);
    S.qi = 0; S.correct = 0; S.hint = 0; S.answered = false;
    S.missed = new Set();
  }
  if(name === 'practice' || name === 'exam'){
    CHALLENGE.active = false;
   S.deck = deckFromBank(name === 'exam' ? 30 : 15);
   S.examRun = (name === 'exam');
    S.qi = 0; S.correct = 0; S.hint = 0; S.answered = false;
    S.missed = new Set();
  }
  if(name === 'mistakes'){
    CHALLENGE.active = false;
    S.deck = deckFromIds(mistakeIds(), MISTAKE_LEN);
    S.qi = 0; S.correct = 0; S.hint = 0; S.answered = false;
    S.missed = new Set();
    /* אין מה לחזור עליו — לא פותחים מסך ריק */
    if(!S.deck.length){ S.screen = 'home'; render(); return; }
  }
  S.screen = name;
  render();
}

function render(){
  document.documentElement.lang = S.lang;
  document.documentElement.dir = LANGS[S.lang].dir;
  document.documentElement.style.setProperty('--read', S.size + 'px');
  /* הגרסה מוצגת רק במצב פיתוח. בכותרת של מוצר היא אומרת למשתמש
     שהוא מחזיק בילד ולא באפליקציה. */
  el('brand').textContent = DEV ? t('app') + ' · ' + BUILD : t('app');
  /* באנגלית שם האפליקציה הוא כבר Talking Theory, ושורת מותג נוספת
     הייתה חוזרת על עצמה מילה במילה. */
  el('brandsub').hidden = S.lang === 'en';
  el('againLabel').textContent = t('again');
  el('btnBack').hidden = S.screen === 'home';
  /* הסרגל שייך למסכים שמקריאים תוכן. נוכחות קבועה של פקד מלמדת
     שיש לו תפקיד — וכשאין לו, היא מבלבלת. */
  el('actions').hidden = ['home','voice','settings','tracker'].includes(S.screen);
  document.body.classList.toggle('hasbar', !el('actions').hidden);

  ({home:renderHome, voice:renderVoice, settings:renderSettings, flow:renderFlow,
    practice:renderPractice, exam:renderPractice, challenge:renderPractice,
    mistakes:renderPractice,
    tracker:renderTracker, result:renderResult})[S.screen]();
  syncFlame();
  syncPlayUI();
}
